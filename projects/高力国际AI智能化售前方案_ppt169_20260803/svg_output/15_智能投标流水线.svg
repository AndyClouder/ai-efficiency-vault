<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <marker id="bidArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M 0,0 L 9,4.5 L 0,9 Z" fill="#246BFE"/>
    </marker>
  </defs>

  <g id="bg">
    <rect width="1280" height="720" fill="#FFFFFF"/>
    <rect x="0" y="0" width="1280" height="6" fill="#0052A6"/>
  </g>

  <g id="header">
    <text x="60" y="70" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#518FEC" letter-spacing="2">03 场景方案 · 投标</text>
    <text x="60" y="115" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="30" font-weight="bold" fill="#17365D">智能投标 — 标书生产全流程智能化</text>
    <text x="60" y="148" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#5E6A78">从招标文件解析到投标材料完整性校验,AI 全流程辅助,降废标风险、提标书质量</text>
  </g>

  <g id="pipeline">
    <text x="60" y="190" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#246BFE" letter-spacing="1">投标流水线 · BID PIPELINE</text>
    <rect x="60" y="210" width="1160" height="220" rx="12" fill="#F4F7FC"/>

    <line x1="225" y1="320" x2="263" y2="320" stroke="#246BFE" stroke-width="2.5" marker-end="url(#bidArrow)"/>
    <line x1="403" y1="320" x2="441" y2="320" stroke="#246BFE" stroke-width="2.5" marker-end="url(#bidArrow)"/>
    <line x1="581" y1="320" x2="619" y2="320" stroke="#246BFE" stroke-width="2.5" marker-end="url(#bidArrow)"/>
    <line x1="759" y1="320" x2="797" y2="320" stroke="#246BFE" stroke-width="2.5" marker-end="url(#bidArrow)"/>
    <line x1="937" y1="320" x2="975" y2="320" stroke="#246BFE" stroke-width="2.5" marker-end="url(#bidArrow)"/>

    <g id="b1">
      <rect x="70" y="270" width="155" height="100" rx="10" fill="#246BFE"/>
      <use data-icon="tabler-outline/file-text" x="127" y="287" width="38" height="38" fill="#FFFFFF" stroke-width="2"/>
      <text x="148" y="345" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">文件解析</text>
      <text x="148" y="362" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="11" fill="#DCE6FB" text-anchor="middle">招标文件拆解</text>
    </g>
    <g id="b2">
      <rect x="248" y="270" width="155" height="100" rx="10" fill="#0052A6"/>
      <use data-icon="tabler-outline/check" x="305" y="287" width="38" height="38" fill="#FFFFFF" stroke-width="2"/>
      <text x="326" y="345" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">资格识别</text>
      <text x="326" y="362" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="11" fill="#DCE6FB" text-anchor="middle">条件核验</text>
    </g>
    <g id="b3">
      <rect x="426" y="270" width="155" height="100" rx="10" fill="#246BFE"/>
      <use data-icon="tabler-outline/chart-bar" x="483" y="287" width="38" height="38" fill="#FFFFFF" stroke-width="2"/>
      <text x="504" y="345" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">评分拆解</text>
      <text x="504" y="362" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="11" fill="#DCE6FB" text-anchor="middle">评分项映射</text>
    </g>
    <g id="b4">
      <rect x="604" y="270" width="155" height="100" rx="10" fill="#0052A6"/>
      <use data-icon="tabler-outline/report" x="661" y="287" width="38" height="38" fill="#FFFFFF" stroke-width="2"/>
      <text x="682" y="345" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">材料匹配</text>
      <text x="682" y="362" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="11" fill="#DCE6FB" text-anchor="middle">历史标书复用</text>
    </g>
    <g id="b5">
      <rect x="782" y="270" width="155" height="100" rx="10" fill="#246BFE"/>
      <use data-icon="tabler-outline/bulb" x="839" y="287" width="38" height="38" fill="#FFFFFF" stroke-width="2"/>
      <text x="860" y="345" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">标书生成</text>
      <text x="860" y="362" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="11" fill="#DCE6FB" text-anchor="middle">内容辅助撰写</text>
    </g>
    <g id="b6">
      <rect x="960" y="270" width="155" height="100" rx="10" fill="#0E9F6E"/>
      <use data-icon="tabler-outline/shield" x="1017" y="287" width="38" height="38" fill="#FFFFFF" stroke-width="2"/>
      <text x="1038" y="345" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">风险检查</text>
      <text x="1038" y="362" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="11" fill="#DCE6FB" text-anchor="middle">完整性校验</text>
    </g>
  </g>

  <g id="pain-vs-value">
    <text x="60" y="468" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#17365D" letter-spacing="1">痛点 → AI 价值对照</text>

    <g id="compare-1">
      <rect x="60" y="485" width="280" height="150" rx="10" fill="#F4F7FC"/>
      <rect x="60" y="485" width="4" height="150" rx="2" fill="#F59E0B"/>
      <text x="80" y="513" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#F59E0B">痛点</text>
      <text x="80" y="543" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#25364A">招标文件多,人工拆解</text>
      <text x="80" y="566" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#25364A">易遗漏关键信息</text>
      <line x1="80" y1="588" x2="320" y2="588" stroke="#E3E9F2" stroke-width="1"/>
      <use data-icon="tabler-outline/file-text" x="80" y="600" width="24" height="24" fill="#246BFE" stroke-width="2"/>
      <text x="112" y="618" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#246BFE">AI 智能解析,字段化拆解</text>
    </g>

    <g id="compare-2">
      <rect x="360" y="485" width="280" height="150" rx="10" fill="#F4F7FC"/>
      <rect x="360" y="485" width="4" height="150" rx="2" fill="#F59E0B"/>
      <text x="380" y="513" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#F59E0B">痛点</text>
      <text x="380" y="543" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#25364A">历史标书散落文件夹,</text>
      <text x="380" y="566" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#25364A">难以复用</text>
      <line x1="380" y1="588" x2="620" y2="588" stroke="#E3E9F2" stroke-width="1"/>
      <use data-icon="tabler-outline/report" x="380" y="600" width="24" height="24" fill="#246BFE" stroke-width="2"/>
      <text x="412" y="618" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#246BFE">历史材料智能匹配复用</text>
    </g>

    <g id="compare-3">
      <rect x="660" y="485" width="280" height="150" rx="10" fill="#F4F7FC"/>
      <rect x="660" y="485" width="4" height="150" rx="2" fill="#F59E0B"/>
      <text x="680" y="513" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#F59E0B">痛点</text>
      <text x="680" y="543" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#25364A">评分点覆盖不充分,方案</text>
      <text x="680" y="566" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#25364A">难贴合招标文件</text>
      <line x1="680" y1="588" x2="920" y2="588" stroke="#E3E9F2" stroke-width="1"/>
      <use data-icon="tabler-outline/chart-bar" x="680" y="600" width="24" height="24" fill="#246BFE" stroke-width="2"/>
      <text x="712" y="618" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#246BFE">评分项拆解,逐项生成</text>
    </g>

    <g id="compare-4">
      <rect x="960" y="485" width="260" height="150" rx="10" fill="#F4F7FC"/>
      <rect x="960" y="485" width="4" height="150" rx="2" fill="#F59E0B"/>
      <text x="980" y="513" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#F59E0B">痛点</text>
      <text x="980" y="543" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#25364A">资格/废标/签章/格式</text>
      <text x="980" y="566" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#25364A">低级失误致废标</text>
      <line x1="980" y1="588" x2="1200" y2="588" stroke="#E3E9F2" stroke-width="1"/>
      <use data-icon="tabler-outline/shield" x="980" y="600" width="24" height="24" fill="#0E9F6E" stroke-width="2"/>
      <text x="1012" y="618" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0E9F6E">七维检查,风险预警</text>
    </g>
  </g>

  <g id="footer">
    <text x="60" y="700" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="11" fill="#6B7785">©法本信息版权所有</text>
    <text x="1220" y="700" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="11" fill="#6B7785" text-anchor="end">15</text>
  </g>
</svg>
