    <text x="80" y="410" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#5E6A78">写字楼 · 商业综合体 · 产业园区</text>
    <text x="80" y="432" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#5E6A78">城市更新 · 大型基建项目</text>

