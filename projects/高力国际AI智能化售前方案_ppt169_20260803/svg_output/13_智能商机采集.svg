<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="bg">
    <rect width="1280" height="720" fill="#FFFFFF"/>
    <rect x="0" y="0" width="1280" height="6" fill="#0052A6"/>
  </g>

  <g id="header">
    <text x="60" y="70" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#518FEC" letter-spacing="2">03 场景方案 · 商机</text>
    <text x="60" y="115" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="30" font-weight="bold" fill="#17365D">智能信息收集与商机识别 — 多源全量采集</text>
    <text x="60" y="148" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#5E6A78">从六大公开渠道持续采集商业地产商机,人工不再遗漏重要项目</text>
  </g>

  <g id="pains">
    <text x="60" y="190" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#F59E0B" letter-spacing="1">五大痛点 · PAIN POINTS</text>
    <rect x="60" y="205" width="220" height="68" rx="10" fill="#F4F7FC"/>
    <rect x="60" y="205" width="4" height="68" rx="2" fill="#F59E0B"/>
    <text x="78" y="233" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#17365D">来源多而散</text>
    <text x="78" y="257" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#5E6A78">人工搜索效率低</text>

    <rect x="294" y="205" width="220" height="68" rx="10" fill="#F4F7FC"/>
    <rect x="294" y="205" width="4" height="68" rx="2" fill="#F59E0B"/>
    <text x="312" y="233" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#17365D">提取困难</text>
    <text x="312" y="257" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#5E6A78">视频图片长文本</text>

    <rect x="528" y="205" width="220" height="68" rx="10" fill="#F4F7FC"/>
    <rect x="528" y="205" width="4" height="68" rx="2" fill="#F59E0B"/>
    <text x="546" y="233" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#17365D">重复缺去重</text>
    <text x="546" y="257" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#5E6A78">信息缺乏关联</text>

    <rect x="762" y="205" width="220" height="68" rx="10" fill="#F4F7FC"/>
    <rect x="762" y="205" width="4" height="68" rx="2" fill="#F59E0B"/>
    <text x="780" y="233" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#17365D">缺价值判断</text>
