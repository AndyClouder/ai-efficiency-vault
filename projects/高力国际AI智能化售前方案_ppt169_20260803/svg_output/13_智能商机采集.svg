    <text x="513" y="376" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" font-weight="bold" fill="#17365D">交易并购</text>
    <text x="475" y="410" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#5E6A78">楼宇出售 · 大宗交易 · 产权转让</text>
    <text x="475" y="432" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#5E6A78">楼宇易主 · 资产收购 · 股权变更</text>

    <rect x="850" y="335" width="370" height="115" rx="10" fill="#F4F7FC"/>
    <use data-icon="tabler-outline/briefcase" x="870" y="355" width="28" height="28" fill="#0E9F6E" stroke-width="2"/>
    <text x="908" y="376" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" font-weight="bold" fill="#17365D">运营搬迁</text>
    <text x="870" y="410" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#5E6A78">新项目招商 · 物业运营招标</text>
    <text x="870" y="432" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#5E6A78">企业搬迁 · 扩建 · 新办公场所</text>
