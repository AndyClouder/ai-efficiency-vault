    <use data-icon="tabler-outline/headset" x="704" y="540" width="30" height="30" fill="#518FEC" stroke-width="2"/>
    <text x="733" y="590" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">短视频</text>
    <text x="733" y="610" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="11" fill="#8FA3C4" text-anchor="middle">抖音等</text>

