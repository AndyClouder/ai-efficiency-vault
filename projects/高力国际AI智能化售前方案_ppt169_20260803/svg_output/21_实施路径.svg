<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <marker id="roadmapArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M 0,0 L 9,4.5 L 0,9 Z" fill="#246BFE"/>
    </marker>
  </defs>

  <g id="bg">
    <rect width="1280" height="720" fill="#FFFFFF"/>
    <rect x="0" y="0" width="1280" height="6" fill="#0052A6"/>
  </g>

  <g id="header">
    <text x="60" y="70" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#518FEC" letter-spacing="2">04 价值与实施</text>
    <text x="60" y="115" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="30" font-weight="bold" fill="#17365D">实施路径 — 试点 · 扩展 · 闭环</text>
    <text x="60" y="148" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#5E6A78">分三阶段稳步推进:先单场景试点验证价值,再横向扩展四场景,最后打通闭环持续运营</text>
  </g>

  <g id="timeline-bar">
    <line x1="120" y1="240" x2="1160" y2="240" stroke="#E3E9F2" stroke-width="3"/>
    <circle cx="200" cy="240" r="14" fill="#246BFE"/>
    <circle cx="640" cy="240" r="14" fill="#0052A6"/>
    <circle cx="1080" cy="240" r="14" fill="#0E9F6E"/>
    <text x="200" y="216" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#246BFE" text-anchor="middle">0</text>
    <text x="640" y="216" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0052A6" text-anchor="middle">3</text>
    <text x="1080" y="216" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0E9F6E" text-anchor="middle">6</text>
    <text x="1180" y="246" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#6B7785">12 月</text>
  </g>

  <g id="phase-1">
    <rect x="60" y="280" width="370" height="340" rx="12" fill="#F4F7FC"/>
    <rect x="60" y="280" width="370" height="60" rx="12" fill="#246BFE"/>
    <rect x="60" y="320" width="370" height="20" fill="#246BFE"/>
    <text x="84" y="318" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#DCE6FB" letter-spacing="2">PHASE 01 · 0-3 月</text>
    <use data-icon="tabler-outline/target" x="320" y="292" width="36" height="36" fill="#FFFFFF" stroke-width="2"/>
    <text x="84" y="375" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="22" font-weight="bold" fill="#17365D">试点验证</text>
    <text x="84" y="402" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#5E6A78">选 1-2 个高价值场景试点</text>

    <circle cx="90" cy="438" r="3" fill="#246BFE"/>
    <text x="104" y="442" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#25364A">建议:智能招聘 + 智能商机</text>
    <circle cx="90" cy="468" r="3" fill="#246BFE"/>
    <text x="104" y="472" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#25364A">验证业务价值与 ROI</text>
    <circle cx="90" cy="498" r="3" fill="#246BFE"/>
    <text x="104" y="502" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#25364A">打通系统集成接口</text>
    <circle cx="90" cy="528" r="3" fill="#246BFE"/>
    <text x="104" y="532" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#25364A">沉淀首批企业知识资产</text>

    <rect x="84" y="560" width="200" height="36" rx="8" fill="#246BFE" fill-opacity="0.12"/>
    <use data-icon="tabler-outline/circle-check" x="92" y="568" width="20" height="20" fill="#246BFE" stroke-width="2"/>
    <text x="120" y="583" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#246BFE">里程碑:试点上线</text>
  </g>

  <g id="phase-2">
    <rect x="455" y="280" width="370" height="340" rx="12" fill="#F4F7FC"/>
    <rect x="455" y="280" width="370" height="60" rx="12" fill="#0052A6"/>
    <rect x="455" y="320" width="370" height="20" fill="#0052A6"/>
    <text x="479" y="318" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#DCE6FB" letter-spacing="2">PHASE 02 · 3-6 月</text>
    <use data-icon="tabler-outline/network" x="715" y="292" width="36" height="36" fill="#FFFFFF" stroke-width="2"/>
    <text x="479" y="375" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="22" font-weight="bold" fill="#17365D">横向扩展</text>
    <text x="479" y="402" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#5E6A78">四大场景全面铺开</text>

    <circle cx="485" cy="438" r="3" fill="#0052A6"/>
    <text x="499" y="442" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#25364A">投标+营销场景上线</text>
    <circle cx="485" cy="468" r="3" fill="#0052A6"/>
    <text x="499" y="472" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#25364A">客户归并 + 决策链</text>
    <circle cx="485" cy="498" r="3" fill="#0052A6"/>
    <text x="499" y="502" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#25364A">作为核心能力建设</text>
    <circle cx="485" cy="528" r="3" fill="#0052A6"/>
    <text x="499" y="532" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#25364A">四场景数据互通</text>

    <rect x="479" y="560" width="200" height="36" rx="8" fill="#0052A6" fill-opacity="0.12"/>
    <use data-icon="tabler-outline/circle-check" x="487" y="568" width="20" height="20" fill="#0052A6" stroke-width="2"/>
    <text x="515" y="583" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0052A6">里程碑:四场景齐备</text>
  </g>

  <g id="phase-3">
    <rect x="850" y="280" width="370" height="340" rx="12" fill="#F4F7FC"/>
    <rect x="850" y="280" width="370" height="60" rx="12" fill="#0E9F6E"/>
    <rect x="850" y="320" width="370" height="20" fill="#0E9F6E"/>
    <text x="874" y="318" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#DCE6FB" letter-spacing="2">PHASE 03 · 6-12 月</text>
    <use data-icon="tabler-outline/refresh" x="1110" y="292" width="36" height="36" fill="#FFFFFF" stroke-width="2"/>
    <text x="874" y="375" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="22" font-weight="bold" fill="#17365D">闭环运营</text>
    <text x="874" y="402" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#5E6A78">打通端到端业务闭环</text>

    <circle cx="880" cy="438" r="3" fill="#0E9F6E"/>
    <text x="894" y="442" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#25364A">七环闭环全链路打通</text>
    <circle cx="880" cy="468" r="3" fill="#0E9F6E"/>
    <text x="894" y="472" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#25364A">复盘回流持续优化</text>
    <circle cx="880" cy="498" r="3" fill="#0E9F6E"/>
    <text x="894" y="502" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#25364A">企业知识资产规模化</text>
    <circle cx="880" cy="528" r="3" fill="#0E9F6E"/>
    <text x="894" y="532" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#25364A">私有化/混合部署落地</text>

    <rect x="874" y="560" width="220" height="36" rx="8" fill="#0E9F6E" fill-opacity="0.14"/>
    <use data-icon="tabler-outline/circle-check" x="882" y="568" width="20" height="20" fill="#0E9F6E" stroke-width="2"/>
    <text x="910" y="583" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0E9F6E">里程碑:闭环持续运营</text>
  </g>

  <g id="footer">
    <text x="60" y="700" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="11" fill="#6B7785">©法本信息版权所有</text>
    <text x="1220" y="700" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="11" fill="#6B7785" text-anchor="end">21</text>
  </g>
</svg>
