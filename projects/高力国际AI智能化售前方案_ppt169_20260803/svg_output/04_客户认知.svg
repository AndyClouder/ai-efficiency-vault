    <rect x="455" y="305" width="370" height="48" rx="12" fill="#246BFE"/>
    <rect x="455" y="337" width="370" height="16" fill="#246BFE"/>
    <use data-icon="tabler-outline/users" x="475" y="316" width="26" height="26" fill="#FFFFFF" stroke-width="2"/>
