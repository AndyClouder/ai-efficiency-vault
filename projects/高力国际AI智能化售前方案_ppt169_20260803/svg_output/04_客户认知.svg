    <circle cx="82" cy="388" r="3" fill="#246BFE"/>
    <text x="95" y="392" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#25364A">咨询策划 · 招商租赁</text>
    <circle cx="82" cy="420" r="3" fill="#246BFE"/>
    <text x="95" y="424" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#25364A">买卖交易 · 资产评估</text>
    <circle cx="82" cy="452" r="3" fill="#246BFE"/>
    <text x="95" y="456" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#25364A">工程项目管理</text>
    <circle cx="82" cy="484" r="3" fill="#246BFE"/>
    <text x="95" y="488" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#25364A">物业及资产管理</text>
  </g>

