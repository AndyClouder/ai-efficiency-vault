<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="bg">
    <rect width="1280" height="720" fill="#FFFFFF"/>
    <rect x="0" y="0" width="1280" height="6" fill="#0052A6"/>
  </g>

  <g id="header">
    <text x="60" y="70" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#518FEC" letter-spacing="2">01 客户理解</text>
    <text x="60" y="115" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="30" font-weight="bold" fill="#17365D">高力国际 — 全球商业地产"五大行"之一</text>
    <text x="60" y="148" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#5E6A78">非传统物业公司,而是商业地产全生命周期服务商;FarAI 愿为其打造覆盖招聘—商机—投标—营销的 AI 闭环</text>
  </g>

  <g id="positioning">
