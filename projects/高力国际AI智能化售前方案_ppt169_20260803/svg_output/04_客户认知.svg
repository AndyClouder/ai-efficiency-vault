  <g id="value-banner">
    <rect x="60" y="555" width="1160" height="92" rx="12" fill="#0052A6"/>
    <use data-icon="tabler-outline/target" x="84" y="580" width="42" height="42" fill="#518FEC" stroke-width="2"/>
    <text x="146" y="589" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#518FEC" letter-spacing="2">价值主张</text>
    <text x="146" y="620" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">FarAI 以 "一个平台 + 四大场景 + 一个闭环",让 AI 成为高力国际的增长新引擎</text>
    <text x="146" y="640" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#B8C7E0">打通"信息发现—商机识别—客户归并—决策链分析—销售跟进—投标支持—结果复盘"完整链路</text>
