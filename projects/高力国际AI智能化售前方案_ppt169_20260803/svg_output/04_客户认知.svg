    <text x="104" y="209" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" font-weight="bold" fill="#17365D">行业定位</text>
    <text x="60" y="245" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#25364A">高力国际(Colliers),全球商业地产 <tspan font-weight="bold" fill="#0052A6">"五大行"</tspan> 之一,</text>
    <text x="60" y="272" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#25364A">围绕商业地产提供全生命周期服务。</text>
  </g>

