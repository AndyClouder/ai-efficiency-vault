    <rect x="850" y="305" width="370" height="48" rx="12" fill="#518FEC"/>
    <rect x="850" y="337" width="370" height="16" fill="#518FEC"/>
    <use data-icon="tabler-outline/network" x="870" y="316" width="26" height="26" fill="#FFFFFF" stroke-width="2"/>
    <text x="906" y="337" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">业务特点</text>
    <circle cx="872" cy="388" r="3" fill="#0052A6"/>
    <text x="885" y="392" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#25364A">管理项目多 · 信息分散</text>
    <circle cx="872" cy="420" r="3" fill="#0052A6"/>
    <text x="885" y="424" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#25364A">销售跟进周期长</text>
    <circle cx="872" cy="452" r="3" fill="#0052A6"/>
    <text x="885" y="456" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#25364A">客户决策链复杂</text>
    <circle cx="872" cy="484" r="3" fill="#0052A6"/>
