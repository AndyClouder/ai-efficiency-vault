    <text x="490" y="392" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#25364A">地产开发商</text>
    <circle cx="477" cy="420" r="3" fill="#0052A6"/>
    <text x="490" y="424" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#25364A">楼宇园区业主 · 投资机构</text>
    <circle cx="477" cy="452" r="3" fill="#0052A6"/>
    <text x="490" y="456" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#25364A">政府部门</text>
    <circle cx="477" cy="484" r="3" fill="#0052A6"/>
    <text x="490" y="488" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#25364A">大型企业</text>
