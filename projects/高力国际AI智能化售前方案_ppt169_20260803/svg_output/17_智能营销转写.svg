<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <marker id="marketingArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M 0,0 L 9,4.5 L 0,9 Z" fill="#20A7B8"/>
    </marker>
  </defs>

  <g id="bg">
    <rect width="1280" height="720" fill="#FFFFFF"/>
    <rect x="0" y="0" width="1280" height="6" fill="#0052A6"/>
  </g>

  <g id="header">
    <text x="60" y="70" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#518FEC" letter-spacing="2">03 场景方案 · 营销</text>
    <text x="60" y="115" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="30" font-weight="bold" fill="#17365D">智能营销与销售录音分析 — 从录音到洞察</text>
    <text x="60" y="148" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#5E6A78">销售录音自动转写并多维分析,把停留在录音里的信息变成可行动的客户洞察</text>
  </g>

  <g id="pains">
    <text x="60" y="190" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#F59E0B" letter-spacing="1">五大痛点 · PAIN POINTS</text>
    <rect x="60" y="205" width="220" height="68" rx="10" fill="#F4F7FC"/>
    <rect x="60" y="205" width="4" height="68" rx="2" fill="#F59E0B"/>
    <text x="78" y="233" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#17365D">录音量大</text>
    <text x="78" y="257" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#5E6A78">无法逐条回听</text>

    <rect x="294" y="205" width="220" height="68" rx="10" fill="#F4F7FC"/>
    <rect x="294" y="205" width="4" height="68" rx="2" fill="#F59E0B"/>
    <text x="312" y="233" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#17365D">缺统一标准</text>
    <text x="312" y="257" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#5E6A78">沟通质量难评</text>

    <rect x="528" y="205" width="220" height="68" rx="10" fill="#F4F7FC"/>
    <rect x="528" y="205" width="4" height="68" rx="2" fill="#F59E0B"/>
    <text x="546" y="233" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#17365D">需求被忽略</text>
    <text x="546" y="257" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#5E6A78">商机难识别</text>

    <rect x="762" y="205" width="220" height="68" rx="10" fill="#F4F7FC"/>
    <rect x="762" y="205" width="4" height="68" rx="2" fill="#F59E0B"/>
    <text x="780" y="233" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#17365D">经验难沉淀</text>
    <text x="780" y="257" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#5E6A78">优秀话术流失</text>

    <rect x="996" y="205" width="224" height="68" rx="10" fill="#F4F7FC"/>
    <rect x="996" y="205" width="4" height="68" rx="2" fill="#F59E0B"/>
    <text x="1014" y="233" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#17365D">数据未关联</text>
    <text x="1014" y="257" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#5E6A78">录音客户脱节</text>
  </g>

  <g id="transcribe-flow">
    <text x="60" y="318" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#20A7B8" letter-spacing="1">转写分析流程 · TRANSCRIBE &amp; ANALYZE</text>
    <rect x="60" y="335" width="1160" height="180" rx="12" fill="#F4F7FC"/>

    <line x1="320" y1="425" x2="388" y2="425" stroke="#20A7B8" stroke-width="3" marker-end="url(#marketingArrow)"/>
    <line x1="620" y1="425" x2="688" y2="425" stroke="#20A7B8" stroke-width="3" marker-end="url(#marketingArrow)"/>
    <line x1="920" y1="425" x2="988" y2="425" stroke="#20A7B8" stroke-width="3" marker-end="url(#marketingArrow)"/>

    <g id="t1">
      <circle cx="190" cy="425" r="100" fill="#FFFFFF" stroke="#20A7B8" stroke-width="2"/>
      <use data-icon="tabler-outline/headset" x="160" y="365" width="60" height="60" fill="#20A7B8" stroke-width="2"/>
      <text x="190" y="450" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#17365D" text-anchor="middle">销售录音</text>
      <text x="190" y="475" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#5E6A78" text-anchor="middle">电话 · 会议录音</text>
    </g>
    <g id="t2">
      <circle cx="490" cy="425" r="100" fill="#20A7B8"/>
      <use data-icon="tabler-outline/microphone" x="460" y="365" width="60" height="60" fill="#FFFFFF" stroke-width="2"/>
      <text x="490" y="450" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">语音转文字</text>
      <text x="490" y="475" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#DCE6FB" text-anchor="middle">ASR 自动转写</text>
    </g>
    <g id="t3">
      <circle cx="790" cy="425" r="100" fill="#FFFFFF" stroke="#20A7B8" stroke-width="2"/>
      <use data-icon="tabler-outline/brain" x="760" y="365" width="60" height="60" fill="#20A7B8" stroke-width="2"/>
      <text x="790" y="450" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#17365D" text-anchor="middle">智能分析</text>
      <text x="790" y="475" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#5E6A78" text-anchor="middle">按规则多维筛选</text>
    </g>
    <g id="t4">
      <circle cx="1090" cy="425" r="100" fill="#0E9F6E"/>
      <use data-icon="tabler-outline/bulb" x="1060" y="365" width="60" height="60" fill="#FFFFFF" stroke-width="2"/>
      <text x="1090" y="450" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">客户洞察</text>
      <text x="1090" y="475" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#DCE6FB" text-anchor="middle">可行动建议</text>
    </g>
  </g>

  <g id="linkage-banner">
    <rect x="60" y="540" width="1160" height="100" rx="12" fill="#17365D"/>
    <use data-icon="tabler-outline/network" x="84" y="563" width="34" height="34" fill="#518FEC" stroke-width="2"/>
    <text x="130" y="572" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#518FEC" letter-spacing="1">自动联动 · 关联与回灌</text>
    <text x="130" y="602" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF">录音信息自动关联 客户 / 项目 / 联系人 / 销售</text>
    <text x="130" y="628" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#B8C7E0">→ 补入客户档案与决策链,避免重要信息只停留在录音或销售个人认知中</text>
  </g>

  <g id="footer">
    <text x="60" y="700" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="11" fill="#6B7785">©法本信息版权所有</text>
    <text x="1220" y="700" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="11" fill="#6B7785" text-anchor="end">17</text>
  </g>
</svg>
