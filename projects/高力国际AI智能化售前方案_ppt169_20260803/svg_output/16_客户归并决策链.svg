<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <marker id="decisionArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M 0,0 L 9,4.5 L 0,9 Z" fill="#518FEC"/>
    </marker>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#246BFE" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#246BFE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g id="bg">
    <rect width="1280" height="720" fill="#FFFFFF"/>
    <rect x="0" y="0" width="1280" height="6" fill="#0052A6"/>
  </g>

  <g id="header">
    <use data-icon="tabler-outline/star" x="60" y="60" width="28" height="28" fill="#F59E0B" stroke-width="2"/>
    <text x="96" y="70" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#F59E0B" letter-spacing="2">03 场景方案 · 投标 · 核心差异化</text>
    <text x="60" y="115" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="30" font-weight="bold" fill="#17365D">客户归并与决策链分析 — 统一客户视图</text>
    <text x="60" y="148" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#5E6A78">同一楼宇/园区被多销售分散跟进时,AI 自动归并为统一客户,并梳理完整决策链 —— 这是高力国际的核心差异化价值</text>
  </g>

  <g id="merge-box">
    <rect x="60" y="180" width="320" height="180" rx="12" fill="#F4F7FC"/>
    <rect x="60" y="180" width="320" height="48" rx="12" fill="#0052A6"/>
    <rect x="60" y="212" width="320" height="16" fill="#0052A6"/>
    <use data-icon="tabler-outline/network" x="80" y="191" width="26" height="26" fill="#FFFFFF" stroke-width="2"/>
    <text x="116" y="212" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF">客户主体识别</text>
    <text x="80" y="258" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#5E6A78">结合多维度信息判断是否同一客户:</text>
    <circle cx="86" cy="284" r="3" fill="#246BFE"/>
    <text x="100" y="288" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#25364A">企业名 · 项目名 · 楼宇地址</text>
    <circle cx="86" cy="308" r="3" fill="#246BFE"/>
    <text x="100" y="312" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#25364A">联系人 · 沟通记录</text>
    <circle cx="86" cy="332" r="3" fill="#246BFE"/>
    <text x="100" y="336" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" fill="#25364A">股权关系</text>
    <rect x="80" y="346" width="200" height="0" fill="none"/>
  </g>

  <g id="center-hub">
    <circle cx="640" cy="380" r="200" fill="url(#centerGlow)"/>

    <line x1="425" y1="335" x2="500" y2="365" stroke="#518FEC" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#decisionArrow)"/>

    <circle cx="640" cy="380" r="95" fill="#0052A6"/>
    <circle cx="640" cy="380" r="95" fill="none" stroke="#518FEC" stroke-width="2" stroke-opacity="0.5"/>
    <use data-icon="tabler-outline/building" x="612" y="335" width="56" height="56" fill="#518FEC" stroke-width="2"/>
    <text x="640" y="412" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">统一客户视图</text>
    <text x="640" y="434" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#B8C7E0" text-anchor="middle">某楼宇/园区/企业</text>

    <text x="640" y="500" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#518FEC" text-anchor="middle">决策链角色向心归并</text>
  </g>

  <g id="role-1">
    <rect x="460" y="190" width="160" height="58" rx="10" fill="#FFFFFF" stroke="#246BFE" stroke-width="1.5"/>
    <circle cx="485" cy="219" r="14" fill="#246BFE"/>
    <use data-icon="tabler-outline/star" x="473" y="207" width="24" height="24" fill="#FFFFFF" stroke-width="2"/>
    <text x="508" y="214" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#17365D">最终决策人</text>
    <text x="508" y="234" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="11" fill="#5E6A78">拍板定方案</text>
    <line x1="540" y1="248" x2="575" y2="312" stroke="#518FEC" stroke-width="1.5" marker-end="url(#decisionArrow)"/>
  </g>

  <g id="role-2">
    <rect x="660" y="190" width="160" height="58" rx="10" fill="#FFFFFF" stroke="#246BFE" stroke-width="1.5"/>
    <circle cx="685" cy="219" r="14" fill="#246BFE"/>
    <use data-icon="tabler-outline/bulb" x="673" y="207" width="24" height="24" fill="#FFFFFF" stroke-width="2"/>
    <text x="708" y="214" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#17365D">需求提出人</text>
    <text x="708" y="234" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="11" fill="#5E6A78">业务部门</text>
    <line x1="740" y1="248" x2="705" y2="312" stroke="#518FEC" stroke-width="1.5" marker-end="url(#decisionArrow)"/>
  </g>

  <g id="role-3">
    <rect x="860" y="285" width="160" height="58" rx="10" fill="#FFFFFF" stroke="#246BFE" stroke-width="1.5"/>
    <circle cx="885" cy="314" r="14" fill="#246BFE"/>
    <use data-icon="tabler-outline/briefcase" x="873" y="302" width="24" height="24" fill="#FFFFFF" stroke-width="2"/>
    <text x="908" y="309" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#17365D">采购招标</text>
    <text x="908" y="329" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="11" fill="#5E6A78">负责人</text>
    <line x1="860" y1="314" x2="740" y2="360" stroke="#518FEC" stroke-width="1.5" marker-end="url(#decisionArrow)"/>
  </g>

  <g id="role-4">
    <rect x="860" y="395" width="160" height="58" rx="10" fill="#FFFFFF" stroke="#246BFE" stroke-width="1.5"/>
    <circle cx="885" cy="424" r="14" fill="#246BFE"/>
    <use data-icon="tabler-outline/users" x="873" y="412" width="24" height="24" fill="#FFFFFF" stroke-width="2"/>
    <text x="908" y="419" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#17365D">项目使用</text>
    <text x="908" y="439" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="11" fill="#5E6A78">部门</text>
    <line x1="860" y1="424" x2="740" y2="400" stroke="#518FEC" stroke-width="1.5" marker-end="url(#decisionArrow)"/>
  </g>

  <g id="role-5">
    <rect x="660" y="490" width="160" height="58" rx="10" fill="#FFFFFF" stroke="#246BFE" stroke-width="1.5"/>
    <circle cx="685" cy="519" r="14" fill="#246BFE"/>
    <use data-icon="tabler-outline/chart-bar" x="673" y="507" width="24" height="24" fill="#FFFFFF" stroke-width="2"/>
    <text x="708" y="514" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#17365D">技术方案</text>
    <text x="708" y="534" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="11" fill="#5E6A78">评估人</text>
    <line x1="740" y1="490" x2="705" y2="448" stroke="#518FEC" stroke-width="1.5" marker-end="url(#decisionArrow)"/>
  </g>

  <g id="role-6">
    <rect x="460" y="490" width="160" height="58" rx="10" fill="#FFFFFF" stroke="#0E9F6E" stroke-width="1.5"/>
    <circle cx="485" cy="519" r="14" fill="#0E9F6E"/>
    <use data-icon="tabler-outline/building" x="473" y="507" width="24" height="24" fill="#FFFFFF" stroke-width="2"/>
    <text x="508" y="514" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#17365D">业主/投资/</text>
    <text x="508" y="534" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="11" fill="#5E6A78">运营/物业方</text>
    <line x1="540" y1="490" x2="575" y2="448" stroke="#518FEC" stroke-width="1.5" marker-end="url(#decisionArrow)"/>
  </g>

  <g id="insight-box">
    <rect x="1050" y="180" width="170" height="180" rx="12" fill="#17365D"/>
    <use data-icon="tabler-outline/share-2" x="1070" y="200" width="28" height="28" fill="#518FEC" stroke-width="2"/>
    <text x="1108" y="222" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">关系洞察</text>
    <line x1="1070" y1="238" x2="1200" y2="238" stroke="#518FEC" stroke-width="1.5" stroke-opacity="0.4"/>
    <circle cx="1076" cy="262" r="3" fill="#518FEC"/>
    <text x="1088" y="266" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#B8C7E0">联系人关系</text>
    <circle cx="1076" cy="290" r="3" fill="#518FEC"/>
    <text x="1088" y="294" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#B8C7E0">影响力排序</text>
    <circle cx="1076" cy="318" r="3" fill="#518FEC"/>
    <text x="1088" y="322" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#B8C7E0">销售掌握信息</text>
    <circle cx="1076" cy="346" r="3" fill="#518FEC"/>
    <text x="1088" y="350" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#B8C7E0">各销售跟进情况</text>
  </g>

  <g id="pain-banner">
    <rect x="60" y="620" width="1160" height="52" rx="10" fill="#F59E0B" fill-opacity="0.12"/>
    <use data-icon="tabler-outline/alert-triangle" x="80" y="632" width="28" height="28" fill="#F59E0B" stroke-width="2"/>
    <text x="118" y="652" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#25364A">痛点对照:同一客户被重复跟进 · 名称不统一 · 信息分散在个人记录与录音 · 关键人物识别不清 —— AI 归并后全部化解</text>
  </g>

  <g id="footer">
    <text x="60" y="700" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="11" fill="#6B7785">©法本信息版权所有</text>
    <text x="1220" y="700" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="11" fill="#6B7785" text-anchor="end">16</text>
  </g>
</svg>
