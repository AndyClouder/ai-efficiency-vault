<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <marker id="parseArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M 0,0 L 9,4.5 L 0,9 Z" fill="#246BFE"/>
    </marker>
  </defs>

  <g id="bg">
    <rect width="1280" height="720" fill="#FFFFFF"/>
    <rect x="0" y="0" width="1280" height="6" fill="#0052A6"/>
  </g>

  <g id="header">
    <text x="60" y="70" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#518FEC" letter-spacing="2">03 场景方案 · 商机</text>
    <text x="60" y="115" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="30" font-weight="bold" fill="#17365D">智能商机 — 解析 · 评分 · 分配</text>
    <text x="60" y="148" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#5E6A78">非结构化内容自动解析为结构化商机线索,按价值评分后秒级分配对应商务</text>
  </g>

  <g id="parse-flow">
    <text x="60" y="190" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#246BFE" letter-spacing="1">智能解析流水线 · PARSING PIPELINE</text>

    <rect x="60" y="210" width="700" height="80" rx="10" fill="#F4F7FC"/>
    <use data-icon="tabler-outline/file-text" x="80" y="232" width="36" height="36" fill="#246BFE" stroke-width="2"/>
    <text x="130" y="240" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#246BFE">STEP 1 · 内容采集</text>
    <text x="130" y="266" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#25364A">网页 / 文档 / 图片 / 音视频等非结构化内容采集</text>

    <line x1="410" y1="295" x2="410" y2="320" stroke="#246BFE" stroke-width="2.5" marker-end="url(#parseArrow)"/>

    <rect x="60" y="325" width="700" height="80" rx="10" fill="#F4F7FC"/>
    <use data-icon="tabler-outline/search" x="80" y="347" width="36" height="36" fill="#0052A6" stroke-width="2"/>
    <text x="130" y="355" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0052A6">STEP 2 · 字段提取</text>
    <text x="130" y="381" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#25364A">智能解析提取 10 大关键字段(见右侧)</text>

    <line x1="410" y1="410" x2="410" y2="435" stroke="#246BFE" stroke-width="2.5" marker-end="url(#parseArrow)"/>

    <rect x="60" y="440" width="700" height="80" rx="10" fill="#F4F7FC"/>
    <use data-icon="tabler-outline/target" x="80" y="462" width="36" height="36" fill="#F59E0B" stroke-width="2"/>
    <text x="130" y="470" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#F59E0B">STEP 3 · 价值评分</text>
    <text x="130" y="496" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#25364A">按客户规则判断商机价值 → 优先级排序 → 自动去重</text>

    <line x1="410" y1="525" x2="410" y2="550" stroke="#246BFE" stroke-width="2.5" marker-end="url(#parseArrow)"/>

    <rect x="60" y="555" width="700" height="80" rx="10" fill="#0E9F6E"/>
    <use data-icon="tabler-outline/users" x="80" y="577" width="36" height="36" fill="#FFFFFF" stroke-width="2"/>
    <text x="130" y="585" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">STEP 4 · 自动分配</text>
    <text x="130" y="611" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#FFFFFF">结构化线索自动推送对应商务 → 记录来源/跟进/转化</text>
  </g>

  <g id="fields">
    <rect x="780" y="210" width="440" height="425" rx="12" fill="#17365D"/>
    <text x="800" y="245" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#518FEC" letter-spacing="1">提取的 10 大关键字段</text>
    <line x1="800" y1="258" x2="960" y2="258" stroke="#518FEC" stroke-width="2"/>

    <circle cx="810" cy="295" r="3" fill="#518FEC"/>
    <text x="824" y="300" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#FFFFFF">项目名称</text>
    <circle cx="1010" cy="295" r="3" fill="#518FEC"/>
    <text x="1024" y="300" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#FFFFFF">项目地址</text>

    <circle cx="810" cy="335" r="3" fill="#518FEC"/>
    <text x="824" y="340" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#FFFFFF">建筑面积</text>
    <circle cx="1010" cy="335" r="3" fill="#518FEC"/>
    <text x="1024" y="340" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#FFFFFF">建设进度</text>

    <circle cx="810" cy="375" r="3" fill="#518FEC"/>
    <text x="824" y="380" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#FFFFFF">业主单位</text>
    <circle cx="1010" cy="375" r="3" fill="#518FEC"/>
    <text x="1024" y="380" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#FFFFFF">投资方</text>

    <circle cx="810" cy="415" r="3" fill="#518FEC"/>
    <text x="824" y="420" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#FFFFFF">交易方</text>
    <circle cx="1010" cy="415" r="3" fill="#518FEC"/>
    <text x="1024" y="420" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#FFFFFF">联系人</text>

    <circle cx="810" cy="455" r="3" fill="#518FEC"/>
    <text x="824" y="460" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#FFFFFF">预算</text>
    <circle cx="1010" cy="455" r="3" fill="#518FEC"/>
    <text x="1024" y="460" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#FFFFFF">招标时间</text>

    <line x1="800" y1="495" x2="1200" y2="495" stroke="#518FEC" stroke-width="1" stroke-opacity="0.3"/>
    <use data-icon="tabler-outline/bulb" x="800" y="515" width="28" height="28" fill="#F59E0B" stroke-width="2"/>
    <text x="838" y="535" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#F59E0B">价值(预估)</text>
    <text x="800" y="570" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#B8C7E0">商机发现时效 <tspan font-weight="bold" fill="#FFFFFF">天级→小时级</tspan></text>
    <text x="800" y="598" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#B8C7E0">商机覆盖率 <tspan font-weight="bold" fill="#FFFFFF">↑3 倍</tspan></text>
    <text x="800" y="626" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#B8C7E0">重复信息 <tspan font-weight="bold" fill="#FFFFFF">自动去重</tspan></text>
  </g>

  <g id="footer">
    <text x="60" y="700" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="11" fill="#6B7785">©法本信息版权所有</text>
    <text x="1220" y="700" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="11" fill="#6B7785" text-anchor="end">14</text>
  </g>
</svg>
