    <text x="674" y="590" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#FFFFFF">录音分析覆盖率 <tspan font-weight="bold">100%</tspan>  ·  商机识别响应 <tspan font-weight="bold">&lt;1 小时</tspan></text>
