<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <marker id="flowArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M 0,0 L 9,4.5 L 0,9 Z" fill="#246BFE"/>
    </marker>
    <marker id="flowArrowLight" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M 0,0 L 9,4.5 L 0,9 Z" fill="#518FEC"/>
    </marker>
  </defs>

  <g id="bg">
    <rect width="1280" height="720" fill="#FFFFFF"/>
    <rect x="0" y="0" width="1280" height="6" fill="#0052A6"/>
  </g>

  <g id="header">
    <text x="60" y="70" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#518FEC" letter-spacing="2">01 客户理解</text>
    <text x="60" y="115" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="30" font-weight="bold" fill="#17365D">整体价值闭环 — 从信息发现到结果复盘</text>
    <text x="60" y="148" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#5E6A78">四大场景串联成完整业务闭环(客户原话),让数据在链路中流动、沉淀、复利</text>
  </g>

  <g id="loop-flow">
    <text x="640" y="200" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#5E6A78" text-anchor="middle" letter-spacing="2">END-TO-END BUSINESS LOOP</text>

    <line x1="190" y1="310" x2="232" y2="310" stroke="#246BFE" stroke-width="2.5" marker-end="url(#flowArrow)"/>
    <line x1="362" y1="310" x2="404" y2="310" stroke="#246BFE" stroke-width="2.5" marker-end="url(#flowArrow)"/>
    <line x1="534" y1="310" x2="576" y2="310" stroke="#246BFE" stroke-width="2.5" marker-end="url(#flowArrow)"/>
    <line x1="706" y1="310" x2="748" y2="310" stroke="#246BFE" stroke-width="2.5" marker-end="url(#flowArrow)"/>
    <line x1="878" y1="310" x2="920" y2="310" stroke="#246BFE" stroke-width="2.5" marker-end="url(#flowArrow)"/>
    <line x1="1050" y1="310" x2="1092" y2="310" stroke="#246BFE" stroke-width="2.5" marker-end="url(#flowArrow)"/>
  </g>

  <g id="step-1">
    <circle cx="125" cy="310" r="62" fill="#246BFE"/>
    <use data-icon="tabler-outline/search" x="105" y="262" width="40" height="40" fill="#FFFFFF" stroke-width="2"/>
    <text x="125" y="325" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">信息发现</text>
  </g>
  <g id="step-2">
    <circle cx="297" cy="310" r="62" fill="#246BFE"/>
    <use data-icon="tabler-outline/target" x="277" y="262" width="40" height="40" fill="#FFFFFF" stroke-width="2"/>
    <text x="297" y="325" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">商机识别</text>
  </g>
  <g id="step-3">
    <circle cx="469" cy="310" r="62" fill="#0052A6"/>
    <use data-icon="tabler-outline/network" x="449" y="262" width="40" height="40" fill="#FFFFFF" stroke-width="2"/>
    <text x="469" y="325" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">客户归并</text>
  </g>
  <g id="step-4">
    <circle cx="641" cy="310" r="62" fill="#0052A6"/>
    <use data-icon="tabler-outline/share-2" x="621" y="262" width="40" height="40" fill="#FFFFFF" stroke-width="2"/>
    <text x="641" y="322" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">决策链分析</text>
  </g>
  <g id="step-5">
    <circle cx="813" cy="310" r="62" fill="#246BFE"/>
    <use data-icon="tabler-outline/headset" x="793" y="262" width="40" height="40" fill="#FFFFFF" stroke-width="2"/>
    <text x="813" y="325" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">销售跟进</text>
  </g>
  <g id="step-6">
    <circle cx="985" cy="310" r="62" fill="#246BFE"/>
    <use data-icon="tabler-outline/file-text" x="965" y="262" width="40" height="40" fill="#FFFFFF" stroke-width="2"/>
    <text x="985" y="325" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">投标支持</text>
  </g>
  <g id="step-7">
    <circle cx="1157" cy="310" r="62" fill="#0E9F6E"/>
    <use data-icon="tabler-outline/refresh" x="1137" y="262" width="40" height="40" fill="#FFFFFF" stroke-width="2"/>
    <text x="1157" y="325" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">结果复盘</text>
  </g>

  <path d="M 1157 372 Q 1157 430 1000 430 Q 640 430 280 430 Q 125 430 125 372" fill="none" stroke="#518FEC" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#flowArrowLight)"/>
  <text x="641" y="455" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#518FEC" text-anchor="middle">复盘结论回流 → 持续优化下一轮商机识别与跟进</text>

  <g id="tech-pillars">
    <rect x="60" y="500" width="1160" height="140" rx="12" fill="#F4F7FC"/>
    <text x="90" y="535" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#17365D">闭环背后的 8 项关键技术能力</text>
    <line x1="90" y1="548" x2="280" y2="548" stroke="#246BFE" stroke-width="2"/>

    <use data-icon="tabler-outline/network" x="90" y="567" width="22" height="22" fill="#246BFE" stroke-width="2"/>
    <text x="120" y="584" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#25364A">多平台数据接入</text>

    <use data-icon="tabler-outline/headset" x="290" y="567" width="22" height="22" fill="#246BFE" stroke-width="2"/>
    <text x="320" y="584" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#25364A">音视频内容解析</text>

    <use data-icon="tabler-outline/users" x="490" y="567" width="22" height="22" fill="#246BFE" stroke-width="2"/>
    <text x="520" y="584" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#25364A">客户主体识别</text>

    <use data-icon="tabler-outline/refresh" x="690" y="567" width="22" height="22" fill="#246BFE" stroke-width="2"/>
    <text x="720" y="584" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#25364A">重复信息合并</text>

    <use data-icon="tabler-outline/share-2" x="90" y="607" width="22" height="22" fill="#246BFE" stroke-width="2"/>
    <text x="120" y="624" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#25364A">人物关系分析</text>

    <use data-icon="tabler-outline/target" x="290" y="607" width="22" height="22" fill="#246BFE" stroke-width="2"/>
    <text x="320" y="624" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#25364A">商机评分</text>

    <use data-icon="tabler-outline/microphone" x="490" y="607" width="22" height="22" fill="#246BFE" stroke-width="2"/>
    <text x="520" y="624" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#25364A">录音分析</text>

    <use data-icon="tabler-outline/briefcase" x="690" y="607" width="22" height="22" fill="#246BFE" stroke-width="2"/>
    <text x="720" y="624" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#25364A">CRM/招聘/投标系统集成</text>
  </g>

  <g id="footer">
    <text x="60" y="700" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="11" fill="#6B7785">©法本信息版权所有</text>
    <text x="1220" y="700" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="11" fill="#6B7785" text-anchor="end">06</text>
  </g>
</svg>
