<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <marker id="recruitArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M 0,0 L 9,4.5 L 0,9 Z" fill="#246BFE"/>
    </marker>
  </defs>

  <g id="bg">
    <rect width="1280" height="720" fill="#FFFFFF"/>
    <rect x="0" y="0" width="1280" height="6" fill="#0052A6"/>
  </g>

  <g id="header">
    <text x="60" y="70" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#518FEC" letter-spacing="2">03 场景方案 · 招聘</text>
    <text x="60" y="115" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="30" font-weight="bold" fill="#17365D">智能招聘 — 基层岗位全流程自动化</text>
    <text x="60" y="148" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#5E6A78">从岗位发布到招聘过程跟踪,AI 覆盖基层招聘全链路,解放招聘人员的重复操作</text>
  </g>

  <g id="pains">
    <text x="60" y="190" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#F59E0B" letter-spacing="1">五大痛点 · PAIN POINTS</text>
    <rect x="60" y="205" width="220" height="68" rx="10" fill="#F4F7FC"/>
    <rect x="60" y="205" width="4" height="68" rx="2" fill="#F59E0B"/>
    <text x="78" y="233" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#17365D">量大流频繁</text>
    <text x="78" y="257" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#5E6A78">基层岗位流动率高</text>

    <rect x="294" y="205" width="220" height="68" rx="10" fill="#F4F7FC"/>
    <rect x="294" y="205" width="4" height="68" rx="2" fill="#F59E0B"/>
    <text x="312" y="233" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#17365D">简历质量参差</text>
    <text x="312" y="257" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#5E6A78">人工筛选量大</text>

    <rect x="528" y="205" width="220" height="68" rx="10" fill="#F4F7FC"/>
    <rect x="528" y="205" width="4" height="68" rx="2" fill="#F59E0B"/>
    <text x="546" y="233" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#17365D">多平台重复</text>
    <text x="546" y="257" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#5E6A78">发布沟通分散</text>

    <rect x="762" y="205" width="220" height="68" rx="10" fill="#F4F7FC"/>
    <rect x="762" y="205" width="4" height="68" rx="2" fill="#F59E0B"/>
    <text x="780" y="233" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#17365D">失联爽约</text>
    <text x="780" y="257" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#5E6A78">到岗率低</text>

    <rect x="996" y="205" width="224" height="68" rx="10" fill="#F4F7FC"/>
    <rect x="996" y="205" width="4" height="68" rx="2" fill="#F59E0B"/>
    <text x="1014" y="233" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#17365D">数据未沉淀</text>
    <text x="1014" y="257" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" fill="#5E6A78">历史候选人浪费</text>
  </g>

  <g id="flow-section">
    <text x="60" y="318" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#246BFE" letter-spacing="1">招聘全流程 · END-TO-END PIPELINE</text>
    <rect x="60" y="335" width="1160" height="180" rx="12" fill="#F4F7FC"/>

    <line x1="220" y1="425" x2="258" y2="425" stroke="#246BFE" stroke-width="2.5" marker-end="url(#recruitArrow)"/>
    <line x1="398" y1="425" x2="436" y2="425" stroke="#246BFE" stroke-width="2.5" marker-end="url(#recruitArrow)"/>
    <line x1="576" y1="425" x2="614" y2="425" stroke="#246BFE" stroke-width="2.5" marker-end="url(#recruitArrow)"/>
    <line x1="754" y1="425" x2="792" y2="425" stroke="#246BFE" stroke-width="2.5" marker-end="url(#recruitArrow)"/>
    <line x1="932" y1="425" x2="970" y2="425" stroke="#246BFE" stroke-width="2.5" marker-end="url(#recruitArrow)"/>

    <g id="s1">
      <circle cx="155" cy="425" r="65" fill="#246BFE"/>
      <use data-icon="tabler-outline/file-text" x="135" y="375" width="40" height="40" fill="#FFFFFF" stroke-width="2"/>
      <text x="155" y="442" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">岗位发布</text>
      <text x="155" y="461" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="11" fill="#DCE6FB" text-anchor="middle">批量发布</text>
    </g>
    <g id="s2">
      <circle cx="328" cy="425" r="65" fill="#0052A6"/>
      <use data-icon="tabler-outline/users" x="308" y="375" width="40" height="40" fill="#FFFFFF" stroke-width="2"/>
      <text x="328" y="442" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">信息收集</text>
      <text x="328" y="461" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="11" fill="#DCE6FB" text-anchor="middle">候选人入库</text>
    </g>
    <g id="s3">
      <circle cx="506" cy="425" r="65" fill="#246BFE"/>
      <use data-icon="tabler-outline/search" x="486" y="375" width="40" height="40" fill="#FFFFFF" stroke-width="2"/>
      <text x="506" y="442" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">条件筛选</text>
      <text x="506" y="461" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="11" fill="#DCE6FB" text-anchor="middle">AI 智能初筛</text>
    </g>
    <g id="s4">
      <circle cx="684" cy="425" r="65" fill="#0052A6"/>
      <use data-icon="tabler-outline/message" x="664" y="375" width="40" height="40" fill="#FFFFFF" stroke-width="2"/>
      <text x="684" y="442" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">沟通邀约</text>
      <text x="684" y="461" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="11" fill="#DCE6FB" text-anchor="middle">自动打招呼</text>
    </g>
    <g id="s5">
      <circle cx="862" cy="425" r="65" fill="#246BFE"/>
      <use data-icon="tabler-outline/robot" x="842" y="375" width="40" height="40" fill="#FFFFFF" stroke-width="2"/>
      <text x="862" y="442" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">面试安排</text>
      <text x="862" y="461" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="11" fill="#DCE6FB" text-anchor="middle">AI 数字人</text>
    </g>
    <g id="s6">
      <circle cx="1040" cy="425" r="65" fill="#0E9F6E"/>
      <use data-icon="tabler-outline/chart-bar" x="1020" y="375" width="40" height="40" fill="#FFFFFF" stroke-width="2"/>
      <text x="1040" y="442" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">过程跟踪</text>
      <text x="1040" y="461" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="11" fill="#DCE6FB" text-anchor="middle">到岗闭环</text>
    </g>
  </g>

  <g id="scope">
    <rect x="60" y="540" width="1160" height="80" rx="12" fill="#17365D"/>
    <use data-icon="tabler-outline/users" x="84" y="563" width="34" height="34" fill="#518FEC" stroke-width="2"/>
    <text x="130" y="572" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#518FEC" letter-spacing="1">招聘对象与渠道</text>
    <text x="130" y="600" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">保安 · 保洁 · 物业服务等基层岗位</text>
    <line x1="500" y1="565" x2="500" y2="600" stroke="#518FEC" stroke-width="1" stroke-opacity="0.4"/>
    <use data-icon="tabler-outline/briefcase" x="524" y="563" width="34" height="34" fill="#518FEC" stroke-width="2"/>
    <text x="570" y="572" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#518FEC" letter-spacing="1">主要渠道</text>
    <text x="570" y="600" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">58 同城等招聘平台</text>
  </g>

  <g id="footer">
    <text x="60" y="700" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="11" fill="#6B7785">©法本信息版权所有</text>
    <text x="1220" y="700" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="11" fill="#6B7785" text-anchor="end">11</text>
  </g>
</svg>
