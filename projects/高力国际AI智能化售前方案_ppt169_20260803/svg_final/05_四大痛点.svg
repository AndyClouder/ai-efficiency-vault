<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="bg">
    <rect width="1280" height="720" fill="#FFFFFF" />
    <rect x="0" y="0" width="1280" height="6" fill="#0052A6" />
  </g>

  <g id="header">
    <text x="60" y="70" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#518FEC" letter-spacing="2">01 客户理解</text>
    <text x="60" y="115" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="30" font-weight="bold" fill="#17365D">四大业务痛点 — 高力国际的 AI 切入点</text>
    <text x="60" y="148" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" fill="#5E6A78">招聘、商机、客户、营销四个环节存在明确的人工瓶颈,正是 AI 的高价值切入点</text>
  </g>

  <g id="pain-1">
    <path fill="#F4F7FC" d="M72,180 H618 A12,12 0 0 1 630,192 V393 A12,12 0 0 1 618,405 H72 A12,12 0 0 1 60,393 V192 A12,12 0 0 1 72,180 Z" />
    <path fill="#246BFE" d="M63,180 H63 A3,3 0 0 1 66,183 V402 A3,3 0 0 1 63,405 H63 A3,3 0 0 1 60,402 V183 A3,3 0 0 1 63,180 Z" />
    <circle cx="108" cy="228" r="26" fill="#246BFE" />
    
  <g transform="translate(92.0, 212.0) scale(1.3333333333333333)" fill="none" stroke="#FFFFFF" stroke-width="2">
    <path d="M5 7a4 4 0 1 0 8 0a4 4 0 1 0 -8 0" />
    <path d="M3 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2" />
    <path d="M16 3.13a4 4 0 0 1 0 7.75" />
    <path d="M21 21v-2a4 4 0 0 0 -3 -3.85" />
  </g>
    <text x="150" y="222" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#246BFE">痛点 01 · 招聘</text>
    <text x="150" y="250" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="22" font-weight="bold" fill="#17365D">招聘量大、流动频繁</text>
    <text x="92" y="300" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#25364A">保安、保洁等基层岗位 <tspan font-weight="bold" fill="#0052A6">量大、流动性高</tspan>,</text>
    <text x="92" y="325" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#25364A">招聘人员需长期在 58 同城等平台</text>
    <text x="92" y="350" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#25364A">重复发布岗位、筛选人员和沟通邀约。</text>
    <path fill="#246BFE" fill-opacity="0.12" d="M103,370 H201 A11,11 0 0 1 212,381 V381 A11,11 0 0 1 201,392 H103 A11,11 0 0 1 92,381 V381 A11,11 0 0 1 103,370 Z" />
    <text x="152" y="385" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" font-weight="bold" fill="#246BFE" text-anchor="middle">→ 智能招聘</text>
  </g>

  <g id="pain-2">
    <path fill="#F4F7FC" d="M662,180 H1208 A12,12 0 0 1 1220,192 V393 A12,12 0 0 1 1208,405 H662 A12,12 0 0 1 650,393 V192 A12,12 0 0 1 662,180 Z" />
    <path fill="#0E9F6E" d="M653,180 H653 A3,3 0 0 1 656,183 V402 A3,3 0 0 1 653,405 H653 A3,3 0 0 1 650,402 V183 A3,3 0 0 1 653,180 Z" />
    <circle cx="698" cy="228" r="26" fill="#0E9F6E" />
    
  <g transform="translate(682.0, 212.0) scale(1.3333333333333333)" fill="none" stroke="#FFFFFF" stroke-width="2">
    <path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" />
    <path d="M21 21l-6 -6" />
  </g>
    <text x="740" y="222" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0E9F6E">痛点 02 · 商机</text>
    <text x="740" y="250" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="22" font-weight="bold" fill="#17365D">商机分散、人工易漏</text>
    <text x="682" y="300" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#25364A">商业地产商机分散在政府网站、招投标</text>
    <text x="682" y="325" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#25364A">平台、短视频、招聘等多渠道, <tspan font-weight="bold" fill="#0052A6">人工收集</tspan></text>
    <text x="682" y="350" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#25364A"><tspan font-weight="bold" fill="#0052A6">效率低、易遗漏</tspan> 重要项目。</text>
    <path fill="#0E9F6E" fill-opacity="0.12" d="M693,370 H791 A11,11 0 0 1 802,381 V381 A11,11 0 0 1 791,392 H693 A11,11 0 0 1 682,381 V381 A11,11 0 0 1 693,370 Z" />
    <text x="742" y="385" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0E9F6E" text-anchor="middle">→ 智能商机</text>
  </g>

