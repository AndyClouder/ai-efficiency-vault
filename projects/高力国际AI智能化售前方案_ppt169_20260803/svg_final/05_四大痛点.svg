    <path fill="#F4F7FC" d="M72,425 H618 A12,12 0 0 1 630,437 V638 A12,12 0 0 1 618,650 H72 A12,12 0 0 1 60,638 V437 A12,12 0 0 1 72,425 Z" />
    <path fill="#F59E0B" d="M63,425 H63 A3,3 0 0 1 66,428 V647 A3,3 0 0 1 63,650 H63 A3,3 0 0 1 60,647 V428 A3,3 0 0 1 63,425 Z" />
