    <path d="M4 14v-3a8 8 0 1 1 16 0v3" />
    <path d="M18 19c0 1.657 -2.686 3 -6 3" />
    <path d="M4 14a2 2 0 0 1 2 -2h1a2 2 0 0 1 2 2v3a2 2 0 0 1 -2 2h-1a2 2 0 0 1 -2 -2v-3" />
    <path d="M15 14a2 2 0 0 1 2 -2h1a2 2 0 0 1 2 2v3a2 2 0 0 1 -2 2h-1a2 2 0 0 1 -2 -2v-3" />
  </g>
    <text x="740" y="467" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="13" font-weight="bold" fill="#20A7B8">痛点 04 · 营销</text>
    <text x="740" y="495" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="22" font-weight="bold" fill="#17365D">录音量大、难回听</text>
    <text x="682" y="545" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#25364A">销售录音数量大,依赖人工回听,</text>
    <text x="682" y="570" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#25364A">话术规范、客户意向、商机 <tspan font-weight="bold" fill="#0052A6">难快速判断</tspan>。</text>
    <path fill="#20A7B8" fill-opacity="0.14" d="M693,595 H791 A11,11 0 0 1 802,606 V606 A11,11 0 0 1 791,617 H693 A11,11 0 0 1 682,606 V606 A11,11 0 0 1 693,595 Z" />
    <text x="742" y="610" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="12" font-weight="bold" fill="#20A7B8" text-anchor="middle">→ 智能营销</text>
  </g>

