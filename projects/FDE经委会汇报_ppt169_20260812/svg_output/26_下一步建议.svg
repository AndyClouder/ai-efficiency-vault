<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="accentLine25" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#246BFE"/>
      <stop offset="100%" stop-color="#0E9F6E" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="#FFFFFF"/>

  <g id="header">
    <text x="60" y="60" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="14" font-weight="600" fill="#0052A6" letter-spacing="3">收尾 · 下一步</text>
    <text x="60" y="100" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="30" font-weight="bold" fill="#25364A">从「认知拉齐」走向「具体行动」</text>
    <rect x="60" y="114" width="240" height="4" rx="2" fill="url(#accentLine25)"/>
    <text x="60" y="146" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="16" fill="#5E6A78">三个起步动作，方向性推进——具体经营方案留后续专题</text>
  </g>

  <!-- 卡1 验证试点 -->
  <g id="action-1">
    <rect x="60" y="185" width="340" height="395" rx="12" fill="#FFFFFF" stroke="#E3E9F2" stroke-width="1"/>
    <rect x="84" y="205" width="64" height="7" rx="3" fill="#0052A6"/>
    <text x="84" y="270" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="60" font-weight="bold" fill="#0052A6" fill-opacity="0.14">01</text>
    <use data-icon="tabler-outline/school" x="316" y="200" width="48" height="48" fill="#0052A6" stroke-width="2"/>
    <text x="84" y="312" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="23" font-weight="bold" fill="#25364A">验证试点</text>
    <line x1="84" y1="332" x2="376" y2="332" stroke="#E3E9F2" stroke-width="1"/>
    <text x="84" y="370" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="16" fill="#5E6A78"><tspan fill="#0052A6" font-weight="bold">·</tspan> 选 1–2 个高容错行业</text>
    <text x="84" y="402" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="16" fill="#5E6A78"><tspan fill="#0052A6" font-weight="bold">·</tspan> 教育 / 传媒 / 文旅</text>
    <text x="84" y="434" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="16" fill="#5E6A78"><tspan fill="#0052A6" font-weight="bold">·</tspan> 跑出可复制的标杆</text>
    <rect x="84" y="490" width="292" height="60" rx="8" fill="#0052A6" fill-opacity="0.07"/>
    <text x="230" y="515" text-anchor="middle" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="13" font-weight="600" fill="#0052A6">第一步</text>
    <text x="230" y="538" text-anchor="middle" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="16" font-weight="bold" fill="#25364A">先打标杆</text>
  </g>

  <!-- 卡2 人才盘点 -->
  <g id="action-2">
    <rect x="470" y="185" width="340" height="395" rx="12" fill="#FFFFFF" stroke="#E3E9F2" stroke-width="1"/>
    <rect x="494" y="205" width="64" height="7" rx="3" fill="#246BFE"/>
    <text x="494" y="270" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="60" font-weight="bold" fill="#246BFE" fill-opacity="0.14">02</text>
    <use data-icon="tabler-outline/users" x="726" y="200" width="48" height="48" fill="#246BFE" stroke-width="2"/>
    <text x="494" y="312" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="23" font-weight="bold" fill="#25364A">人才盘点</text>
    <line x1="494" y1="332" x2="786" y2="332" stroke="#E3E9F2" stroke-width="1"/>
    <text x="494" y="370" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="16" fill="#5E6A78"><tspan fill="#246BFE" font-weight="bold">·</tspan> 按 4 特质盘人（业务/实操/AI/结果）</text>
    <text x="494" y="402" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="16" fill="#5E6A78"><tspan fill="#246BFE" font-weight="bold">·</tspan> SA / 交付 / 行业专家最接近</text>
    <text x="494" y="434" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="16" fill="#5E6A78"><tspan fill="#246BFE" font-weight="bold">·</tspan> 启动转型培养</text>
    <rect x="494" y="490" width="292" height="60" rx="8" fill="#246BFE" fill-opacity="0.08"/>
    <text x="640" y="515" text-anchor="middle" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="13" font-weight="600" fill="#246BFE">第二步</text>
    <text x="640" y="538" text-anchor="middle" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="16" font-weight="bold" fill="#25364A">人才优先</text>
  </g>

  <!-- 卡3 建机制 -->
  <g id="action-3">
    <rect x="880" y="185" width="340" height="395" rx="12" fill="#0E9F6E" fill-opacity="0.05" stroke="#0E9F6E" stroke-width="1.5"/>
    <rect x="904" y="205" width="64" height="7" rx="3" fill="#0E9F6E"/>
    <text x="904" y="270" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="60" font-weight="bold" fill="#0E9F6E" fill-opacity="0.16">03</text>
    <use data-icon="tabler-outline/refresh" x="1136" y="200" width="48" height="48" fill="#0E9F6E" stroke-width="2"/>
    <text x="904" y="312" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="23" font-weight="bold" fill="#25364A">建机制</text>
    <line x1="904" y1="332" x2="1196" y2="332" stroke="#E3E9F2" stroke-width="1"/>
    <text x="904" y="370" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="16" fill="#5E6A78"><tspan fill="#0E9F6E" font-weight="bold">·</tspan> 沉淀 / 复用纳入绩效</text>
    <text x="904" y="402" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="16" fill="#5E6A78"><tspan fill="#0E9F6E" font-weight="bold">·</tspan> 设 Skill / 本体沉淀专项</text>
    <text x="904" y="434" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="16" fill="#5E6A78"><tspan fill="#0E9F6E" font-weight="bold">·</tspan> 让经验真正算进绩效</text>
    <rect x="904" y="490" width="292" height="60" rx="8" fill="#0E9F6E"/>
    <text x="1050" y="515" text-anchor="middle" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="13" font-weight="600" fill="#FFFFFF">第三步</text>
    <text x="1050" y="538" text-anchor="middle" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="16" font-weight="bold" fill="#FFFFFF">机制保障</text>
  </g>

  <!-- 底部方向性推进带 -->
  <g id="cta-band">
    <rect x="60" y="600" width="1160" height="60" rx="12" fill="#0052A6"/>
    <use data-icon="tabler-outline/arrow-right" x="500" y="616" width="28" height="28" fill="#FFFFFF" stroke-width="2"/>
    <text x="640" y="638" text-anchor="middle" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="18" font-weight="bold" fill="#FFFFFF">三个起步动作，方向性推进 · 具体经营方案留后续专题</text>
  </g>

  <g id="footer">
    <text x="60" y="690" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="12" fill="#6B7785">法本信息 · FDE 经委会汇报 · 谢谢</text>
    <text x="1220" y="690" text-anchor="end" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="11" fill="#6B7785">26 / 26</text>
  </g>
</svg>
