<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="accentLine21" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#246BFE"/>
      <stop offset="100%" stop-color="#518FEC" stop-opacity="0.15"/>
    </linearGradient>
    <marker id="arrow21" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,1 L8,5 L0,9 Z" fill="#518FEC"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#FFFFFF"/>

  <g id="header">
    <text x="60" y="60" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="14" font-weight="600" fill="#0052A6" letter-spacing="3">05 · 人才与组织</text>
    <text x="60" y="100" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="30" font-weight="bold" fill="#25364A">市场上几乎招不到，出路是内部转型 + 项目制培养</text>
    <rect x="60" y="114" width="240" height="4" rx="2" fill="url(#accentLine21)"/>
    <text x="60" y="146" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="16" fill="#5E6A78">复合人才极度稀缺，关键在现有角色（SA / 交付 / 行业专家）的转型</text>
  </g>

  <!-- 上排左卡：外招困境 -->
  <g id="card-hiring">
    <rect x="60" y="165" width="560" height="165" rx="12" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="100" cy="205" r="22" fill="#F59E0B" fill-opacity="0.14"/>
    <use data-icon="tabler-outline/alert-triangle" x="82" y="187" width="36" height="36" fill="#F59E0B" stroke-width="2"/>
    <text x="138" y="200" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="13" font-weight="600" fill="#F59E0B">现实困境</text>
    <text x="138" y="222" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="19" font-weight="bold" fill="#25364A">不能全靠外招</text>
    <text x="84" y="258" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="15" fill="#5E6A78"><tspan fill="#F59E0B" font-weight="bold">·</tspan> 强 FDE 高溢价、弱 FDE 普通化</text>
    <text x="84" y="286" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="15" fill="#5E6A78"><tspan fill="#F59E0B" font-weight="bold">·</tspan> 真正的 FDE，市场上几乎招不到</text>
    <text x="84" y="314" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="15" fill="#5E6A78"><tspan fill="#F59E0B" font-weight="bold">·</tspan> 外招成本高、文化融合难、流失快</text>
  </g>

  <!-- 上排右卡：内部转型 -->
  <g id="card-convert">
    <rect x="660" y="165" width="560" height="165" rx="12" fill="#0052A6" fill-opacity="0.04" stroke="#0052A6" stroke-width="1.5"/>
    <circle cx="700" cy="205" r="22" fill="#0052A6" fill-opacity="0.12"/>
    <use data-icon="tabler-outline/users" x="682" y="187" width="36" height="36" fill="#0052A6" stroke-width="2"/>
    <text x="738" y="200" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="13" font-weight="600" fill="#0052A6">真正出路</text>
    <text x="738" y="222" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="19" font-weight="bold" fill="#25364A">内部转型</text>
    <text x="684" y="258" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="15" fill="#5E6A78"><tspan fill="#0052A6" font-weight="bold">·</tspan> 深耕行业的 SA 最接近完整 FDE 能力模型</text>
    <text x="684" y="286" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="15" fill="#5E6A78"><tspan fill="#0052A6" font-weight="bold">·</tspan> 交付、行业专家皆可转型</text>
    <text x="684" y="314" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="15" fill="#5E6A78"><tspan fill="#0052A6" font-weight="bold">·</tspan> 关键 = 意愿 + 培训 + 工具</text>
  </g>

  <!-- 培养阶梯标题 -->
  <g id="ladder-title">
    <text x="60" y="370" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="18" font-weight="bold" fill="#25364A">培养是项目制，不是课堂制</text>
    <text x="330" y="370" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="14" fill="#6B7785">在项目里长出来，不是在课堂里教出来</text>
  </g>

  <!-- 培养阶梯 3 阶段 -->
  <g id="ladder-arrows">
    <line x1="400" y1="455" x2="436" y2="455" stroke="#518FEC" stroke-width="3" marker-end="url(#arrow21)"/>
    <line x1="780" y1="455" x2="816" y2="455" stroke="#518FEC" stroke-width="3" marker-end="url(#arrow21)"/>
  </g>

  <g id="stage-1">
    <rect x="60" y="385" width="340" height="140" rx="12" fill="#FFFFFF" stroke="#E3E9F2" stroke-width="1"/>
    <rect x="60" y="385" width="340" height="6" rx="3" fill="#518FEC"/>
    <rect x="80" y="404" width="92" height="28" rx="14" fill="#518FEC" fill-opacity="0.14"/>
    <text x="126" y="423" text-anchor="middle" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="14" font-weight="bold" fill="#518FEC">0–3 个月</text>
    <text x="80" y="462" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="19" font-weight="bold" fill="#25364A">打基础</text>
    <text x="80" y="492" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="15" fill="#5E6A78">工具链 · 方法论 · 跟岗实习</text>
    <text x="80" y="514" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="15" fill="#5E6A78">建立 FDE 的基本手感</text>
  </g>

  <g id="stage-2">
    <rect x="440" y="385" width="340" height="140" rx="12" fill="#FFFFFF" stroke="#E3E9F2" stroke-width="1"/>
    <rect x="440" y="385" width="340" height="6" rx="3" fill="#246BFE"/>
    <rect x="460" y="404" width="110" height="28" rx="14" fill="#246BFE" fill-opacity="0.14"/>
    <text x="515" y="423" text-anchor="middle" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="14" font-weight="bold" fill="#246BFE">9–18 个月</text>
    <text x="460" y="462" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="19" font-weight="bold" fill="#25364A">独立交付</text>
    <text x="460" y="492" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="15" fill="#5E6A78">独立带客户、端到端落地</text>
    <text x="460" y="514" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="15" fill="#5E6A78">成为可上战场的 FDE</text>
  </g>

  <g id="stage-3">
    <rect x="820" y="385" width="340" height="140" rx="12" fill="#0052A6" fill-opacity="0.05" stroke="#0052A6" stroke-width="1.5"/>
    <rect x="820" y="385" width="340" height="6" rx="3" fill="#0052A6"/>
    <rect x="840" y="404" width="100" height="28" rx="14" fill="#0052A6"/>
    <text x="890" y="423" text-anchor="middle" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="14" font-weight="bold" fill="#FFFFFF">18 个月+</text>
    <text x="840" y="462" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="19" font-weight="bold" fill="#0052A6">能定义问题</text>
    <text x="840" y="492" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="15" fill="#25364A">从解决问题到定义问题</text>
    <text x="840" y="514" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="15" fill="#25364A">接近创业的能力</text>
  </g>

  <!-- 底部失血警示 -->
  <g id="bleed-warning">
    <rect x="60" y="545" width="1160" height="62" rx="12" fill="#F59E0B" fill-opacity="0.10"/>
    <rect x="60" y="545" width="6" height="62" rx="3" fill="#F59E0B"/>
    <use data-icon="tabler-outline/alert-triangle" x="84" y="559" width="34" height="34" fill="#F59E0B" stroke-width="2"/>
    <text x="132" y="575" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="14" font-weight="bold" fill="#B45309">一线失血陷阱</text>
    <text x="132" y="597" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="16" fill="#25364A">警惕「干得好就调回总部」——刚培养成熟就被抽走，是 FDE 团队最大的隐性损耗</text>
  </g>

  <g id="footer">
    <text x="1220" y="690" text-anchor="end" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="11" fill="#6B7785">21 / 25</text>
  </g>
</svg>
