<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="accentLine3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#246BFE"/>
      <stop offset="100%" stop-color="#518FEC" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="#FFFFFF"/>

  <g id="header">
    <text x="60" y="60" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="14" font-weight="600" fill="#0052A6" letter-spacing="3">01 · FDE 到底是什么</text>
    <text x="60" y="100" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="30" font-weight="bold" fill="#25364A">咨询、外包、FDE，解决的是不同层面的问题</text>
    <rect x="60" y="114" width="240" height="4" rx="2" fill="url(#accentLine3)"/>
    <text x="60" y="146" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="16" fill="#5E6A78">同一案例（银行信贷自动化）下，三种角色的做法与留下东西完全不同</text>
  </g>

  <!-- 卡1 咨询顾问 -->
  <g id="card-consulting">
    <rect x="70" y="185" width="360" height="430" rx="12" fill="#FFFFFF" stroke="#E3E9F2" stroke-width="1"/>
    <rect x="94" y="205" width="56" height="6" rx="3" fill="#20A7B8"/>
    <use data-icon="tabler-outline/file-text" x="362" y="200" width="44" height="44" fill="#20A7B8" stroke-width="2"/>
    <text x="94" y="272" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="24" font-weight="bold" fill="#25364A">咨询顾问</text>
    <line x1="94" y1="292" x2="406" y2="292" stroke="#E3E9F2" stroke-width="1"/>
    <text x="94" y="330" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="18" fill="#5E6A78">驻场两周，产出 80 页诊断 PPT</text>
    <text x="94" y="362" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="18" fill="#5E6A78">画出转型路线图与优先级</text>
    <text x="94" y="394" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="18" fill="#5E6A78">交付报告后撤出，不碰系统</text>
    <rect x="94" y="528" width="312" height="62" rx="8" fill="#20A7B8" fill-opacity="0.08"/>
    <text x="110" y="556" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="13" fill="#20A7B8" font-weight="600">本质</text>
    <text x="110" y="578" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="17" font-weight="bold" fill="#25364A">买的是建议，不是结果</text>
  </g>

  <!-- 卡2 外包工程师 -->
  <g id="card-outsourcing">
    <rect x="460" y="185" width="360" height="430" rx="12" fill="#FFFFFF" stroke="#E3E9F2" stroke-width="1"/>
    <rect x="484" y="205" width="56" height="6" rx="3" fill="#6B7785"/>
    <use data-icon="tabler-outline/briefcase" x="752" y="200" width="44" height="44" fill="#6B7785" stroke-width="2"/>
    <text x="484" y="272" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="24" font-weight="bold" fill="#25364A">外包工程师</text>
    <line x1="484" y1="292" x2="796" y2="292" stroke="#E3E9F2" stroke-width="1"/>
    <text x="484" y="330" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="18" fill="#5E6A78">等待需求文档到位</text>
    <text x="484" y="362" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="18" fill="#5E6A78">按文档编码、上线、收尾款</text>
    <text x="484" y="394" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="18" fill="#5E6A78">交付一套系统后撤场</text>
    <rect x="484" y="528" width="312" height="62" rx="8" fill="#6B7785" fill-opacity="0.08"/>
    <text x="500" y="556" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="13" fill="#6B7785" font-weight="600">本质</text>
    <text x="500" y="578" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="17" font-weight="bold" fill="#25364A">买的是工时，不是能力</text>
  </g>

  <!-- 卡3 FDE 主角 -->
  <g id="card-fde">
    <rect x="850" y="185" width="360" height="430" rx="12" fill="#0052A6" fill-opacity="0.04" stroke="#0052A6" stroke-width="1.5"/>
    <rect x="874" y="205" width="64" height="8" rx="4" fill="#0052A6"/>
    <use data-icon="tabler-outline/target" x="1142" y="200" width="44" height="44" fill="#0052A6" stroke-width="2"/>
    <rect x="1062" y="206" width="116" height="30" rx="15" fill="#0052A6"/>
    <text x="1120" y="226" text-anchor="middle" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="13" font-weight="bold" fill="#FFFFFF">我们的方向</text>
    <text x="874" y="272" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="24" font-weight="bold" fill="#0052A6">FDE 现场工程师</text>
    <line x1="874" y1="292" x2="1186" y2="292" stroke="#B8C7E0" stroke-width="1"/>
    <text x="874" y="330" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="18" fill="#25364A">坐到风控经理旁边</text>
    <text x="874" y="362" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="18" fill="#25364A">第一周就动手改模型</text>
    <text x="874" y="394" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="18" fill="#25364A">把一线问题回流给产品团队</text>
    <rect x="874" y="528" width="312" height="62" rx="8" fill="#0052A6"/>
    <text x="890" y="556" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="13" fill="#DCE6FB" font-weight="600">本质</text>
    <text x="890" y="578" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="17" font-weight="bold" fill="#FFFFFF">买的是结果，还留下资产</text>
  </g>

  <g id="footer">
    <text x="60" y="690" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="12" fill="#6B7785">案例：银行信贷自动化 · 三种角色对同一问题的不同介入层面</text>
    <text x="1220" y="690" text-anchor="end" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="11" fill="#6B7785">03 / 25</text>
  </g>
</svg>
