<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="chapBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2A5E"/>
      <stop offset="60%" stop-color="#0E367A"/>
      <stop offset="100%" stop-color="#17365D"/>
    </linearGradient>
    <linearGradient id="chapBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#246BFE"/>
      <stop offset="100%" stop-color="#518FEC"/>
    </linearGradient>
    <radialGradient id="chapDecor" cx="80%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#246BFE" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#246BFE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g id="background">
    <rect width="1280" height="720" fill="url(#chapBg)"/>
    <rect width="1280" height="720" fill="url(#chapDecor)"/>
  </g>

  <g id="chapter-bignum">
    <text x="1170" y="500" text-anchor="end" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="220" font-weight="bold" fill="#FFFFFF" fill-opacity="0.10">01</text>
  </g>

  <g id="chapter-eyebrow">
    <rect x="120" y="290" width="6" height="28" rx="3" fill="url(#chapBar)"/>
    <text x="140" y="312" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="18" font-weight="600" fill="#518FEC" letter-spacing="5">CHAPTER 01</text>
  </g>

  <g id="chapter-title">
    <text x="120" y="400" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="44" font-weight="bold" fill="#FFFFFF">FDE 到底是什么</text>
    <rect x="122" y="425" width="220" height="4" rx="2" fill="#246BFE"/>
    <text x="120" y="475" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="20" fill="#B8C7E0">不是外包、不是咨询，是「现场解决问题 + 沉淀资产」</text>
  </g>

  <g id="chapter-footer">
    <text x="120" y="668" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="13" fill="#8FA3C4">FDE 经委会汇报 · 第一章</text>
    <text x="1200" y="668" text-anchor="end" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="13" fill="#8FA3C4">02 / 25</text>
  </g>
</svg>
