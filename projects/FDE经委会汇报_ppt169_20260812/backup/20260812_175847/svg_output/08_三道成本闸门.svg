<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="accentLine8" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#246BFE"/>
      <stop offset="100%" stop-color="#518FEC" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="#FFFFFF"/>

  <g id="header">
    <text x="60" y="60" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="14" font-weight="600" fill="#0052A6" letter-spacing="3">02 · 机会与销毛潜力</text>
    <text x="60" y="100" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="30" font-weight="bold" fill="#25364A">AI 打开三道成本闸门，过去「不划算」的重交付重新可行</text>
    <rect x="60" y="114" width="240" height="4" rx="2" fill="url(#accentLine8)"/>
    <text x="60" y="146" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="16" fill="#5E6A78">三项成本同时下降，是 FDE 这类重交付模式「现在才成立」的底层原因</text>
  </g>

  <!-- 卡1 行业知识蒸馏 -->
  <g id="card-distill">
    <rect x="60" y="185" width="340" height="380" rx="12" fill="#FFFFFF" stroke="#E3E9F2" stroke-width="1"/>
    <circle cx="230" cy="252" r="44" fill="#0052A6" fill-opacity="0.08"/>
    <use data-icon="tabler-outline/bulb" x="208" y="230" width="44" height="44" fill="#0052A6" stroke-width="2"/>
    <circle cx="266" cy="220" r="17" fill="#0E9F6E"/>
    <text x="266" y="227" text-anchor="middle" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="22" font-weight="bold" fill="#FFFFFF">↓</text>
    <text x="230" y="335" text-anchor="middle" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="20" font-weight="bold" fill="#25364A">行业知识蒸馏成本</text>
    <rect x="150" y="352" width="160" height="32" rx="16" fill="#0E9F6E" fill-opacity="0.12"/>
    <text x="230" y="374" text-anchor="middle" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="15" font-weight="bold" fill="#0E9F6E">成本 ↓ 显著下降</text>
    <text x="230" y="420" text-anchor="middle" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="17" fill="#5E6A78">一线人员能现场写脚本、</text>
    <text x="230" y="448" text-anchor="middle" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="17" fill="#5E6A78">封装工具、搭原型</text>
    <rect x="84" y="486" width="292" height="60" rx="8" fill="#F4F7FC"/>
    <text x="230" y="514" text-anchor="middle" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="14" fill="#0052A6" font-weight="600">意味着</text>
    <text x="230" y="535" text-anchor="middle" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="15" fill="#25364A">经验不再锁在专家脑子里</text>
  </g>

  <!-- 卡2 定制开发 -->
  <g id="card-build">
    <rect x="470" y="185" width="340" height="380" rx="12" fill="#FFFFFF" stroke="#E3E9F2" stroke-width="1"/>
    <circle cx="640" cy="252" r="44" fill="#0052A6" fill-opacity="0.08"/>
    <use data-icon="tabler-outline/route" x="618" y="230" width="44" height="44" fill="#0052A6" stroke-width="2"/>
    <circle cx="676" cy="220" r="17" fill="#0E9F6E"/>
    <text x="676" y="227" text-anchor="middle" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="22" font-weight="bold" fill="#FFFFFF">↓</text>
    <text x="640" y="335" text-anchor="middle" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="20" font-weight="bold" fill="#25364A">定制开发成本</text>
    <rect x="560" y="352" width="160" height="32" rx="16" fill="#0E9F6E" fill-opacity="0.12"/>
    <text x="640" y="374" text-anchor="middle" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="15" font-weight="bold" fill="#0E9F6E">成本 ↓ 显著下降</text>
    <text x="640" y="420" text-anchor="middle" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="17" fill="#5E6A78">小团队即可完成</text>
    <text x="640" y="448" text-anchor="middle" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="17" fill="#5E6A78">从想法到价值验证</text>
    <rect x="494" y="486" width="292" height="60" rx="8" fill="#F4F7FC"/>
    <text x="640" y="514" text-anchor="middle" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="14" fill="#0052A6" font-weight="600">意味着</text>
    <text x="640" y="535" text-anchor="middle" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="15" fill="#25364A">过去不划算的定制，现在做得起</text>
  </g>

  <!-- 卡3 复合型人才供给 -->
  <g id="card-talent">
    <rect x="880" y="185" width="340" height="380" rx="12" fill="#FFFFFF" stroke="#E3E9F2" stroke-width="1"/>
    <circle cx="1050" cy="252" r="44" fill="#0052A6" fill-opacity="0.08"/>
    <use data-icon="tabler-outline/users" x="1028" y="230" width="44" height="44" fill="#0052A6" stroke-width="2"/>
    <circle cx="1086" cy="220" r="17" fill="#0E9F6E"/>
    <text x="1086" y="227" text-anchor="middle" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="22" font-weight="bold" fill="#FFFFFF">↓</text>
    <text x="1050" y="335" text-anchor="middle" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="20" font-weight="bold" fill="#25364A">复合型人才供给成本</text>
    <rect x="970" y="352" width="160" height="32" rx="16" fill="#0E9F6E" fill-opacity="0.12"/>
    <text x="1050" y="374" text-anchor="middle" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="15" font-weight="bold" fill="#0E9F6E">成本 ↓ 显著下降</text>
    <text x="1050" y="420" text-anchor="middle" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="17" fill="#5E6A78">AI 补齐部分工程 / 文档 /</text>
    <text x="1050" y="448" text-anchor="middle" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="17" fill="#5E6A78">产品能力</text>
    <rect x="904" y="486" width="292" height="60" rx="8" fill="#F4F7FC"/>
    <text x="1050" y="514" text-anchor="middle" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="14" fill="#0052A6" font-weight="600">意味着</text>
    <text x="1050" y="535" text-anchor="middle" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="15" fill="#25364A">一个人能顶多个角色</text>
  </g>

  <!-- 底部总结 -->
  <g id="summary-band">
    <rect x="60" y="588" width="1160" height="70" rx="12" fill="#0052A6"/>
    <use data-icon="tabler-outline/trending-up" x="88" y="606" width="34" height="34" fill="#FFFFFF" stroke-width="2"/>
    <text x="136" y="624" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="14" font-weight="600" fill="#DCE6FB">底层逻辑</text>
    <text x="136" y="648" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="18" font-weight="bold" fill="#FFFFFF">可编码的经验正在廉价化，不可编码的洞察正在稀缺化</text>
  </g>

  <g id="footer">
    <text x="1220" y="690" text-anchor="end" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="11" fill="#6B7785">08 / 25</text>
  </g>
</svg>
