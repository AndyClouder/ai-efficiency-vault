<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="accentLine24" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#246BFE"/>
      <stop offset="100%" stop-color="#518FEC" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="#FFFFFF"/>

  <g id="header">
    <text x="60" y="60" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="14" font-weight="600" fill="#0052A6" letter-spacing="3">收束 · 四句话</text>
    <text x="60" y="100" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="30" font-weight="bold" fill="#25364A">四句话收束全场</text>
    <rect x="60" y="114" width="240" height="4" rx="2" fill="url(#accentLine24)"/>
    <text x="60" y="146" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="16" fill="#5E6A78">潜力、真相、路径、人才——一句话一个判断</text>
  </g>

  <!-- 段1 潜力 -->
  <g id="point-1">
    <circle cx="120" cy="210" r="28" fill="#0052A6" fill-opacity="0.12"/>
    <use data-icon="tabler-outline/target" x="96" y="186" width="48" height="48" fill="#0052A6" stroke-width="2"/>
    <text x="178" y="200" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="24" font-weight="bold" fill="#0052A6">潜力</text>
    <text x="178" y="232" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="17" fill="#5E6A78">AI 落地的最后一公里，有真实的高销毛逻辑</text>
    <text x="1190" y="230" text-anchor="end" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="58" font-weight="bold" fill="#0052A6" fill-opacity="0.10">01</text>
    <line x1="60" y1="262" x2="1220" y2="262" stroke="#E3E9F2" stroke-width="1"/>
  </g>

  <!-- 段2 真相 -->
  <g id="point-2">
    <circle cx="120" cy="325" r="28" fill="#F59E0B" fill-opacity="0.14"/>
    <use data-icon="tabler-outline/alert-triangle" x="96" y="301" width="48" height="48" fill="#F59E0B" stroke-width="2"/>
    <text x="178" y="315" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="24" font-weight="bold" fill="#F59E0B">真相</text>
    <text x="178" y="347" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="17" fill="#5E6A78">新兴行业，国内国外不同，难在人、周期长——别让它变成经营压力</text>
    <text x="1190" y="345" text-anchor="end" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="58" font-weight="bold" fill="#F59E0B" fill-opacity="0.12">02</text>
    <line x1="60" y1="377" x2="1220" y2="377" stroke="#E3E9F2" stroke-width="1"/>
  </g>

  <!-- 段3 路径 -->
  <g id="point-3">
    <circle cx="120" cy="440" r="28" fill="#246BFE" fill-opacity="0.12"/>
    <use data-icon="tabler-outline/route" x="96" y="416" width="48" height="48" fill="#246BFE" stroke-width="2"/>
    <text x="178" y="430" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="24" font-weight="bold" fill="#246BFE">路径</text>
    <text x="178" y="462" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="17" fill="#5E6A78">先验证、先沉淀、先打标杆——原厂打样、伙伴复制、先易后难</text>
    <text x="1190" y="460" text-anchor="end" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="58" font-weight="bold" fill="#246BFE" fill-opacity="0.10">03</text>
    <line x1="60" y1="492" x2="1220" y2="492" stroke="#E3E9F2" stroke-width="1"/>
  </g>

  <!-- 段4 人才 -->
  <g id="point-4">
    <circle cx="120" cy="555" r="28" fill="#0E9F6E" fill-opacity="0.14"/>
    <use data-icon="tabler-outline/users" x="96" y="531" width="48" height="48" fill="#0E9F6E" stroke-width="2"/>
    <text x="178" y="545" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="24" font-weight="bold" fill="#0E9F6E">人才</text>
    <text x="178" y="577" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="17" fill="#5E6A78">人才策略跟着阶段走——从「把人当资源」到「把人当资产」，AI 不取代驾驭它的人</text>
    <text x="1190" y="575" text-anchor="end" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="58" font-weight="bold" fill="#0E9F6E" fill-opacity="0.12">04</text>
  </g>

  <!-- 底部战略总括 -->
  <g id="verdict">
    <rect x="60" y="618" width="1160" height="52" rx="12" fill="#0052A6"/>
    <text x="640" y="651" text-anchor="middle" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="19" font-weight="bold" fill="#FFFFFF">FDE 值得战略投入 · 战略重视 · 节奏稳妥 · 人才优先</text>
  </g>

  <g id="footer">
    <text x="1220" y="690" text-anchor="end" font-family='"Microsoft YaHei", Arial, sans-serif' font-size="11" fill="#6B7785">25 / 26</text>
  </g>
</svg>
