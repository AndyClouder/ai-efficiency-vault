    <line x1="510" y1="402" x2="770" y2="402" stroke="#E3E9F2" stroke-width="1" />
    <text x="640" y="438" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="17" fill="#5E6A78">行业术语、边界情况</text>
    <text x="640" y="468" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="17" fill="#5E6A78">需 Prompt / 规则 / 数据 / 测试集</text>
    <path fill="#518FEC" fill-opacity="0.10" d="M528,506 H752 A18,18 0 0 1 770,524 V524 A18,18 0 0 1 752,542 H528 A18,18 0 0 1 510,524 V524 A18,18 0 0 1 528,506 Z" />
    <text x="640" y="530" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" font-weight="600" fill="#518FEC">很难 · 投入陡增</text>
  </g>

  
  <g id="card-99">
    <path fill="#0052A6" fill-opacity="0.05" stroke="#0052A6" stroke-width="1.5" d="M892,190 H1208 A12,12 0 0 1 1220,202 V548 A12,12 0 0 1 1208,560 H892 A12,12 0 0 1 880,548 V202 A12,12 0 0 1 892,190 Z" />
    <text x="1050" y="296" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="80" font-weight="bold" fill="#0052A6">99<tspan font-size="32" fill="#0052A6">％</tspan></text>
    <text x="1050" y="328" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#0052A6">95 → 99％</text>
    <path fill="#0052A6" d="M996,348 H1104 A16,16 0 0 1 1120,364 V364 A16,16 0 0 1 1104,380 H996 A16,16 0 0 1 980,364 V364 A16,16 0 0 1 996,348 Z" />
    <text x="1050" y="370" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">可靠期 · FDE</text>
    <line x1="920" y1="402" x2="1180" y2="402" stroke="#B8C7E0" stroke-width="1" />
    <text x="1050" y="438" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="17" fill="#25364A">1％ 错误可能致严重后果</text>
    <text x="1050" y="468" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="17" fill="#25364A">专用平台 + 万级真实数据</text>
    <path fill="#0052A6" d="M938,506 H1162 A18,18 0 0 1 1180,524 V524 A18,18 0 0 1 1162,542 H938 A18,18 0 0 1 920,524 V524 A18,18 0 0 1 938,506 Z" />
    <text x="1050" y="530" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">FDE 的主战场</text>
  </g>

  
  <g id="stat-band">
    <path fill="#F4F7FC" d="M72,588 H1208 A12,12 0 0 1 1220,600 V646 A12,12 0 0 1 1208,658 H72 A12,12 0 0 1 60,646 V600 A12,12 0 0 1 72,588 Z" />
    <path fill="#F59E0B" d="M63,588 H63 A3,3 0 0 1 66,591 V655 A3,3 0 0 1 63,658 H63 A3,3 0 0 1 60,655 V591 A3,3 0 0 1 63,588 Z" />
    <text x="92" y="636" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="40" font-weight="bold" fill="#F59E0B">&gt;60％</text>
    <text x="240" y="622" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="17" font-weight="600" fill="#25364A">的企业 AI 尝试仍停在试点阶段</text>
    <text x="240" y="646" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#5E6A78">即卡在「80％ 之前」——多数项目死在试点走向生产之间</text>
  </g>

