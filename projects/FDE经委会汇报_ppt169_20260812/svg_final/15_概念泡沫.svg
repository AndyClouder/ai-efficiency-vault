    <path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4" />
  </g>
    <text x="156" y="488" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="18" font-weight="bold" fill="#25364A">产品沉淀弱</text>
    <text x="156" y="516" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#5E6A78">交付完即走，不留 Skill / 模板 / 本体，下一个客户又从零开始</text>
    <path fill="#F59E0B" fill-opacity="0.14" d="M1076,477 H1182 A16,16 0 0 1 1198,493 V493 A16,16 0 0 1 1182,509 H1076 A16,16 0 0 1 1060,493 V493 A16,16 0 0 1 1076,477 Z" />
    <text x="1129" y="498" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#B45309">× 不是 FDE</text>
  </g>

  
  <g id="stance-band">
    <path fill="#0E9F6E" fill-opacity="0.10" d="M72,552 H1208 A12,12 0 0 1 1220,564 V616 A12,12 0 0 1 1208,628 H72 A12,12 0 0 1 60,616 V564 A12,12 0 0 1 72,552 Z" />
    <path fill="#0E9F6E" d="M63,552 H63 A3,3 0 0 1 66,555 V625 A3,3 0 0 1 63,628 H63 A3,3 0 0 1 60,625 V555 A3,3 0 0 1 63,552 Z" />
    
  <g transform="translate(84.0, 572.0) scale(1.5)" fill="none" stroke="#0E9F6E" stroke-width="2">
    <path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0" />
    <path d="M9 12l2 2l4 -4" />
  </g>
    <text x="132" y="586" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="15" fill="#5E6A78">从业者类比「十年前的产品经理」——窗口期 5–10 年，会大浪淘沙</text>
    <text x="132" y="614" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="19" font-weight="bold" fill="#0E9F6E">我们的立场：做真 FDE，不做伪 FDE</text>
  </g>

