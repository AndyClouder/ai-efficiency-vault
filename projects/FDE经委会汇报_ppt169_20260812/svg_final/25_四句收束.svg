    <text x="178" y="577" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="17" fill="#5E6A78">人才策略跟着阶段走——从「把人当资源」到「把人当资产」，AI 不取代驾驭它的人</text>
    <text x="1190" y="575" text-anchor="end" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="58" font-weight="bold" fill="#0E9F6E" fill-opacity="0.12">04</text>
