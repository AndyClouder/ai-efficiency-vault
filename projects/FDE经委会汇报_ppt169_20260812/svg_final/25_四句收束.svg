    <text x="178" y="232" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="17" fill="#5E6A78">AI 落地的最后一公里，有真实的高销毛逻辑</text>
    <text x="1190" y="230" text-anchor="end" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="58" font-weight="bold" fill="#0052A6" fill-opacity="0.10">01</text>
    <line x1="60" y1="262" x2="1220" y2="262" stroke="#E3E9F2" stroke-width="1" />
