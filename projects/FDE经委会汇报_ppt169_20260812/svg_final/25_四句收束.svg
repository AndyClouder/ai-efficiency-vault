    <text x="178" y="315" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="24" font-weight="bold" fill="#F59E0B">真相</text>
    <text x="178" y="347" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="17" fill="#5E6A78">新兴行业，国内国外不同，难在人、周期长——别让它变成经营压力</text>
    <text x="1190" y="345" text-anchor="end" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="58" font-weight="bold" fill="#F59E0B" fill-opacity="0.12">02</text>
