    <text x="178" y="462" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="17" fill="#5E6A78">先验证、先沉淀、先打标杆——原厂打样、伙伴复制、先易后难</text>
    <text x="1190" y="460" text-anchor="end" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="58" font-weight="bold" fill="#246BFE" fill-opacity="0.10">03</text>
