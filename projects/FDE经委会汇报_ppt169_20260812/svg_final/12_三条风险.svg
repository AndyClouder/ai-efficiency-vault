    <text x="640" y="312" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="22" font-weight="bold" fill="#25364A">人才苛刻到招不到</text>
    <line x1="492" y1="338" x2="788" y2="338" stroke="#FBD9A0" stroke-width="1.5" />
    <text x="492" y="378" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="17" fill="#5E6A78"><tspan fill="#F59E0B" font-weight="bold">·</tspan> 复合人才极度稀缺，几乎招不到</text>
    <text x="492" y="412" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="17" fill="#5E6A78"><tspan fill="#F59E0B" font-weight="bold">·</tspan> 内部转型需「意愿 + 培训 + 工具」</text>
    <text x="492" y="446" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="17" fill="#5E6A78"><tspan fill="#F59E0B" font-weight="bold">·</tspan> 培养周期长达 9–18 个月</text>
    <path fill="#F59E0B" fill-opacity="0.08" d="M500,478 H780 A8,8 0 0 1 788,486 V522 A8,8 0 0 1 780,530 H500 A8,8 0 0 1 492,522 V486 A8,8 0 0 1 500,478 Z" />
