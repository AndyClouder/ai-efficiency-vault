    <text x="240" y="262" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" font-weight="bold" fill="#B45309" letter-spacing="2">风险 ①</text>
    <text x="240" y="312" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="22" font-weight="bold" fill="#25364A">新兴行业无规范</text>
    <line x1="92" y1="338" x2="388" y2="338" stroke="#FBD9A0" stroke-width="1.5" />
    <text x="92" y="378" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="17" fill="#5E6A78"><tspan fill="#F59E0B" font-weight="bold">·</tspan> 业务流程无行业标准</text>
    <text x="92" y="412" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="17" fill="#5E6A78"><tspan fill="#F59E0B" font-weight="bold">·</tspan> 商业化路径尚不成熟</text>
    <text x="92" y="446" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="17" fill="#5E6A78"><tspan fill="#F59E0B" font-weight="bold">·</tspan> 成功案例可复制性待验证</text>
