  <g id="ladder-title">
    <text x="60" y="370" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="18" font-weight="bold" fill="#25364A">培养是项目制，不是课堂制</text>
    <text x="330" y="370" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#6B7785">FDE 能力不是培训出来的，是在真实项目里长出来的</text>
  </g>

  
