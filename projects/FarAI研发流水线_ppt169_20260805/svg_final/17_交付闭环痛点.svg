    <text x="374" y="416" font-size="11" fill="#DCE6FB" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif">AI + Agent 协作</text>
  </g>
  <line x1="456" y1="394" x2="486" y2="394" stroke="#246BFE" stroke-width="2" marker-end="url(#arrowS2)" />

