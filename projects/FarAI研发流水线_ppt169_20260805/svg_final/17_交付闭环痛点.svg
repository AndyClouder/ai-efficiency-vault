    <text x="118" y="98" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif">S2</text>
    <text x="146" y="100" font-size="28" font-weight="bold" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">AI 写的代码不敢合、不敢重构,质量靠人工把关</text>
  </g>

  <g id="pain-section">
    <path fill="#F4F7FC" d="M94,136 H1186 A14,14 0 0 1 1200,150 V246 A14,14 0 0 1 1186,260 H94 A14,14 0 0 1 80,246 V150 A14,14 0 0 1 94,136 Z" />
    <path fill="#F59E0B" d="M83,136 H83 A3,3 0 0 1 86,139 V257 A3,3 0 0 1 83,260 H83 A3,3 0 0 1 80,257 V139 A3,3 0 0 1 83,136 Z" />
    
  <g transform="translate(110.0, 158.0) scale(1.25)" fill="none" stroke="#F59E0B" stroke-width="2">
    <path d="M12 9v4" />
    <path d="M10.363 3.591l-8.106 13.534a1.914 1.914 0 0 0 1.636 2.871h16.214a1.914 1.914 0 0 0 1.636 -2.87l-8.106 -13.536a1.914 1.914 0 0 0 -3.274 0" />
    <path d="M12 16h.01" />
  </g>
    <text x="150" y="180" font-size="18" font-weight="bold" fill="#F59E0B" font-family="Microsoft YaHei, Arial, sans-serif">痛点</text>
    <text x="150" y="212" font-size="15" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">工程师用 AI 写代码很快 → 但代码评审靠人肉、测试靠人工、环境数据靠手动准备</text>
    <text x="150" y="240" font-size="15" font-weight="bold" fill="#F59E0B" font-family="Microsoft YaHei, Arial, sans-serif">→ 不敢快速合并、不敢重构、不敢频繁发布</text>
  </g>

  <g id="loop-label">
    <text x="80" y="304" font-size="16" font-weight="bold" fill="#246BFE" font-family="Microsoft YaHei, Arial, sans-serif">交付闭环:质量内嵌在每一步</text>
    <text x="80" y="328" font-size="13" fill="#6B7785" font-family="Microsoft YaHei, Arial, sans-serif">质量不是最后一道关,而是交付闭环每一步的内置能力</text>
  </g>

