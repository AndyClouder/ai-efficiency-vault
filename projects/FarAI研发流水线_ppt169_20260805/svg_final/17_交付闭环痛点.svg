  <g id="key-takeaway">
    <path fill="#246BFE" d="M94,476 H1186 A14,14 0 0 1 1200,490 V622 A14,14 0 0 1 1186,636 H94 A14,14 0 0 1 80,622 V490 A14,14 0 0 1 94,476 Z" />
    <text x="640" y="528" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif">没有自动化安全网,AI 写得再快组织也不敢合并、重构、发布</text>
    <line x1="540" y1="556" x2="740" y2="556" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.4" />
    <text x="640" y="592" font-size="16" fill="#DCE6FB" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif">Harness 先行 → AI 改完即可验证 → 组织才敢让 AI 高频自主</text>
  </g>

  <g id="footer">
