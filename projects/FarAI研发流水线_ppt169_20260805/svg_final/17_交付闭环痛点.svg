    <path d="M9 12l2 2l4 -4" />
  </g>
    <text x="568" y="394" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif">fullcheck 全检</text>
    <text x="568" y="416" font-size="11" fill="#DCE6FB" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif">AI 改完即验证</text>
  </g>
  <line x1="650" y1="394" x2="680" y2="394" stroke="#246BFE" stroke-width="2" marker-end="url(#arrowS2)" />

