  </g>
    <text x="956" y="394" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif">AI 代码评审</text>
    <text x="956" y="416" font-size="11" fill="#DCE6FB" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif">缺陷/安全/性能</text>
  </g>
  <line x1="1038" y1="394" x2="1068" y2="394" stroke="#246BFE" stroke-width="2" marker-end="url(#arrowS2)" />

