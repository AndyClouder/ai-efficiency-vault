<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />
  </g>

  <g id="page-title">
    <path fill="#0052A6" d="M83,56 H133 A3,3 0 0 1 136,59 V59 A3,3 0 0 1 133,62 H83 A3,3 0 0 1 80,59 V59 A3,3 0 0 1 83,56 Z" />
    <circle cx="118" cy="92" r="14" fill="#0052A6" />
    <text x="118" y="98" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif">S1</text>
    <text x="146" y="100" font-size="28" font-weight="bold" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">让需求在进入开发前,就和真实系统发生碰撞</text>
    <text x="80" y="128" font-size="15" fill="#6B7785" font-family="Microsoft YaHei, Arial, sans-serif">编码 Agent 反向提问,把需求缺陷消灭在开发前</text>
  </g>

  <g id="capability-block">
    <path fill="#F4F7FC" d="M96,160 H704 A16,16 0 0 1 720,176 V604 A16,16 0 0 1 704,620 H96 A16,16 0 0 1 80,604 V176 A16,16 0 0 1 96,160 Z" />
    
  <g transform="translate(108.0, 184.0) scale(1.3333333333333333)" fill="none" stroke="#0052A6" stroke-width="2">
    <path d="M13 3l0 7l6 0l-8 11l0 -7l-6 0l8 -11" />
  </g>
    <text x="150" y="208" font-size="20" font-weight="bold" fill="#0052A6" font-family="Microsoft YaHei, Arial, sans-serif">FarAI 能力</text>
    <line x1="108" y1="232" x2="692" y2="232" stroke="#E3E9F2" stroke-width="1" />

    <g id="cap-1">
      <circle cx="124" cy="280" r="14" fill="#0052A6" />
      <text x="124" y="286" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif">1</text>
      
  <g transform="translate(148.0, 264.0) scale(1.1666666666666667)" fill="none" stroke="#246BFE" stroke-width="2">
    <path d="M7 8l-4 4l4 4" />
    <path d="M17 8l4 4l-4 4" />
    <path d="M14 4l-4 16" />
  </g>
      <text x="184" y="284" font-size="16" font-weight="bold" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">编码 Agent 反读代码库</text>
      <text x="184" y="308" font-size="14" fill="#5E6A78" font-family="Microsoft YaHei, Arial, sans-serif">读取接口契约、数据结构、历史需求、现有配置</text>
    </g>

    <g id="cap-2">
      <circle cx="124" cy="360" r="14" fill="#0052A6" />
      <text x="124" y="366" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif">2</text>
      
  <g transform="translate(148.0, 344.0) scale(1.1666666666666667)" fill="none" stroke="#246BFE" stroke-width="2">
    <path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" />
    <path d="M21 21l-6 -6" />
  </g>
      <text x="184" y="364" font-size="16" font-weight="bold" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">自动识别需求缺陷</text>
      <text x="184" y="388" font-size="14" fill="#5E6A78" font-family="Microsoft YaHei, Arial, sans-serif">歧义、边界缺失、验收标准不全</text>
    </g>

    <g id="cap-3">
      <circle cx="124" cy="440" r="14" fill="#0052A6" />
      <text x="124" y="446" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif">3</text>
      
  <g transform="translate(148.0, 424.0) scale(1.1666666666666667)" fill="none" stroke="#246BFE" stroke-width="2">
    <path d="M8 9h8" />
    <path d="M8 13h6" />
    <path d="M18 4a3 3 0 0 1 3 3v8a3 3 0 0 1 -3 3h-5l-5 3v-3h-2a3 3 0 0 1 -3 -3v-8a3 3 0 0 1 3 -3h12" />
  </g>
      <text x="184" y="444" font-size="16" font-weight="bold" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">生成澄清问题清单</text>
      <text x="184" y="468" font-size="14" fill="#5E6A78" font-family="Microsoft YaHei, Arial, sans-serif">反向推动产品澄清边界、异常、权限、状态流</text>
    </g>

    <g id="cap-4">
      <circle cx="124" cy="520" r="14" fill="#0052A6" />
      <text x="124" y="526" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif">4</text>
      
  <g transform="translate(148.0, 504.0) scale(1.1666666666666667)" fill="none" stroke="#246BFE" stroke-width="2">
    <path d="M14 3v4a1 1 0 0 0 1 1h4" />
    <path d="M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2" />
    <path d="M9 9l1 0" />
    <path d="M9 13l6 0" />
    <path d="M9 17l6 0" />
  </g>
      <text x="184" y="524" font-size="16" font-weight="bold" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">输出可验证需求契约</text>
      <text x="184" y="548" font-size="14" fill="#5E6A78" font-family="Microsoft YaHei, Arial, sans-serif">契约驱动开发,需求即测试基线</text>
    </g>
  </g>

  <g id="value-block">
    <path fill="#0052A6" d="M756,160 H1184 A16,16 0 0 1 1200,176 V604 A16,16 0 0 1 1184,620 H756 A16,16 0 0 1 740,604 V176 A16,16 0 0 1 756,160 Z" />
    
  <g transform="translate(768.0, 184.0) scale(1.3333333333333333)" fill="none" stroke="#FFFFFF" stroke-width="2">
    <path d="M3 17l6 -6l4 4l8 -8" />
    <path d="M14 7l7 0l0 7" />
  </g>
    <text x="810" y="208" font-size="20" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif">价值</text>
    <line x1="768" y1="232" x2="1172" y2="232" stroke="#246BFE" stroke-width="1" />

    <g id="val-1">
      <text x="768" y="300" font-size="40" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif">↓40-50%</text>
      <text x="768" y="332" font-size="16" fill="#DCE6FB" font-family="Microsoft YaHei, Arial, sans-serif">需求返工率</text>
      <text x="768" y="354" font-size="12" fill="#8FA3C4" font-family="Microsoft YaHei, Arial, sans-serif">(预估)</text>
    </g>

    <line x1="768" y1="380" x2="1172" y2="380" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.15" />

    <g id="val-2">
      <text x="768" y="440" font-size="40" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif">↑2-3 倍</text>
      <text x="768" y="472" font-size="16" fill="#DCE6FB" font-family="Microsoft YaHei, Arial, sans-serif">需求一次澄清通过率</text>
      <text x="768" y="494" font-size="12" fill="#8FA3C4" font-family="Microsoft YaHei, Arial, sans-serif">(预估)</text>
    </g>

    <line x1="768" y1="520" x2="1172" y2="520" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.15" />

    <g id="val-3">
      <text x="768" y="572" font-size="18" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif">开发前消缺</text>
      <text x="768" y="596" font-size="14" fill="#DCE6FB" font-family="Microsoft YaHei, Arial, sans-serif">隐形成本节省(预估)</text>
    </g>
  </g>

  <g id="footer">
    <text x="80" y="688" font-size="12" fill="#6B7785" font-family="Microsoft YaHei, Arial, sans-serif">第四章 · S1 智能需求闭环</text>
    <text x="1200" y="688" font-size="11" fill="#6B7785" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif">16 / 30</text>
  </g>
</svg>