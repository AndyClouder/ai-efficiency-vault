    <text x="146" y="100" font-size="28" font-weight="bold" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">需求不清反复返工,PRD 进开发前没和真实系统碰撞</text>
  </g>

  <g id="pain-section">
    <path fill="#F4F7FC" d="M94,136 H1186 A14,14 0 0 1 1200,150 V238 A14,14 0 0 1 1186,252 H94 A14,14 0 0 1 80,238 V150 A14,14 0 0 1 94,136 Z" />
