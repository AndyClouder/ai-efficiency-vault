<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />
  </g>

  <g id="page-title">
    <path fill="#0052A6" d="M83,56 H133 A3,3 0 0 1 136,59 V59 A3,3 0 0 1 133,62 H83 A3,3 0 0 1 80,59 V59 A3,3 0 0 1 83,56 Z" />
    <text x="80" y="100" font-size="30" font-weight="bold" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">先建 Harness 再放 Agent,顺序错了全是反模式</text>
    <text x="80" y="132" font-size="15" fill="#6B7785" font-family="Microsoft YaHei, Arial, sans-serif">Harness 先行,Agent 在 Harness 内跑;先放 Agent 再补 Harness = 不可控</text>
  </g>

  <g id="correct-block">
    <path fill="#F4F7FC" d="M96,172 H604 A16,16 0 0 1 620,188 V556 A16,16 0 0 1 604,572 H96 A16,16 0 0 1 80,556 V188 A16,16 0 0 1 96,172 Z" />
    <path fill="#0E9F6E" d="M96,172 H604 A16,16 0 0 1 620,188 V216 A16,16 0 0 1 604,232 H96 A16,16 0 0 1 80,216 V188 A16,16 0 0 1 96,172 Z" />
    <rect x="80" y="200" width="540" height="32" fill="#0E9F6E" />
    
  <g transform="translate(104.0, 186.0) scale(1.3333333333333333)" fill="none" stroke="#FFFFFF" stroke-width="2">
    <path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0" />
    <path d="M9 12l2 2l4 -4" />
  </g>
    <text x="146" y="210" font-size="20" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif">✓ 正确顺序</text>
    <text x="590" y="210" font-size="13" fill="#DCE6FB" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif">Harness First</text>

    <g id="correct-step-1">
      <circle cx="120" cy="282" r="18" fill="#0E9F6E" />
      <text x="120" y="288" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif">01</text>
      <text x="152" y="278" font-size="17" font-weight="bold" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">Harness 先建</text>
      <text x="152" y="302" font-size="13" fill="#5E6A78" font-family="Microsoft YaHei, Arial, sans-serif">CLI / fullcheck / E2E / hooks 工程底座就位</text>
    </g>

    <g id="correct-step-2">
      <circle cx="120" cy="362" r="18" fill="#0E9F6E" />
      <text x="120" y="368" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif">02</text>
      <text x="152" y="358" font-size="17" font-weight="bold" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">Agent 在 Harness 内跑</text>
      <text x="152" y="382" font-size="13" fill="#5E6A78" font-family="Microsoft YaHei, Arial, sans-serif">Loop / Graph / 任务编排 在驾驭框架内运行</text>
    </g>

    <g id="correct-step-3">
      <circle cx="120" cy="442" r="18" fill="#0E9F6E" />
      <text x="120" y="448" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif">03</text>
      <text x="152" y="438" font-size="17" font-weight="bold" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">feedback 反哺 Harness</text>
      <text x="152" y="462" font-size="13" fill="#5E6A78" font-family="Microsoft YaHei, Arial, sans-serif">Agent 执行反馈持续强化驾驭框架</text>
    </g>

    <path fill="#0E9F6E" fill-opacity="0.1" d="M116,506 H584 A10,10 0 0 1 594,516 V540 A10,10 0 0 1 584,550 H116 A10,10 0 0 1 106,540 V516 A10,10 0 0 1 116,506 Z" />
    <text x="350" y="534" font-size="14" font-weight="bold" fill="#0E9F6E" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif">可控 → 可验证 → 可持续放大自主度</text>
  </g>

  <g id="wrong-block">
    <path fill="#F4F7FC" d="M676,172 H1184 A16,16 0 0 1 1200,188 V556 A16,16 0 0 1 1184,572 H676 A16,16 0 0 1 660,556 V188 A16,16 0 0 1 676,172 Z" />
    <path fill="#F59E0B" d="M676,172 H1184 A16,16 0 0 1 1200,188 V216 A16,16 0 0 1 1184,232 H676 A16,16 0 0 1 660,216 V188 A16,16 0 0 1 676,172 Z" />
    <rect x="660" y="200" width="540" height="32" fill="#F59E0B" />
    
  <g transform="translate(684.0, 186.0) scale(1.3333333333333333)" fill="none" stroke="#FFFFFF" stroke-width="2">
    <path d="M9 9v-1a3 3 0 0 1 6 0v1" />
    <path d="M8 9h8a6 6 0 0 1 1 3v3a5 5 0 0 1 -10 0v-3a6 6 0 0 1 1 -3" />
    <path d="M3 13l4 0" />
    <path d="M17 13l4 0" />
    <path d="M12 20l0 -6" />
    <path d="M4 19l3.35 -2" />
    <path d="M20 19l-3.35 -2" />
    <path d="M4 7l3.75 2.4" />
    <path d="M20 7l-3.75 2.4" />
  </g>
    <text x="726" y="210" font-size="20" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif">✗ 反模式</text>
    <text x="1170" y="210" font-size="13" fill="#DCE6FB" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif">Agent First</text>

    <g id="wrong-1">
      <path fill="#FFFFFF" stroke="#F59E0B" stroke-width="1" d="M696,262 H1164 A10,10 0 0 1 1174,272 V344 A10,10 0 0 1 1164,354 H696 A10,10 0 0 1 686,344 V272 A10,10 0 0 1 696,262 Z" />
      <text x="704" y="290" font-size="16" font-weight="bold" fill="#F59E0B" font-family="Microsoft YaHei, Arial, sans-serif">Loop Engineering</text>
      <text x="704" y="316" font-size="13" fill="#5E6A78" font-family="Microsoft YaHei, Arial, sans-serif">先让 Agent 跑循环,再补约束</text>
      <text x="704" y="338" font-size="12" fill="#6B7785" font-family="Microsoft YaHei, Arial, sans-serif">→ 循环失控,事故已发生,补不回来</text>
    </g>

    <g id="wrong-2">
      <path fill="#FFFFFF" stroke="#F59E0B" stroke-width="1" d="M696,370 H1164 A10,10 0 0 1 1174,380 V452 A10,10 0 0 1 1164,462 H696 A10,10 0 0 1 686,452 V380 A10,10 0 0 1 696,370 Z" />
      <text x="704" y="398" font-size="16" font-weight="bold" fill="#F59E0B" font-family="Microsoft YaHei, Arial, sans-serif">Graph Engineering</text>
      <text x="704" y="424" font-size="13" fill="#5E6A78" font-family="Microsoft YaHei, Arial, sans-serif">先让 Agent 跑任务图,再补治理</text>
      <text x="704" y="446" font-size="12" fill="#6B7785" font-family="Microsoft YaHei, Arial, sans-serif">→ 任务图失控,治理滞后于破坏</text>
    </g>

    <path fill="#F59E0B" fill-opacity="0.1" d="M696,478 H1164 A10,10 0 0 1 1174,488 V540 A10,10 0 0 1 1164,550 H696 A10,10 0 0 1 686,540 V488 A10,10 0 0 1 696,478 Z" />
    <text x="930" y="506" font-size="14" font-weight="bold" fill="#F59E0B" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif">共性:顺序错了</text>
    <text x="930" y="530" font-size="13" fill="#5E6A78" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif">后期补 Harness 成本极高,且事故已发生</text>
  </g>

  <g id="conclusion">
    <path fill="#0052A6" d="M94,596 H1186 A14,14 0 0 1 1200,610 V642 A14,14 0 0 1 1186,656 H94 A14,14 0 0 1 80,642 V610 A14,14 0 0 1 94,596 Z" />
    <text x="640" y="634" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif">先建安全网,再放大自主度</text>
  </g>

  <g id="footer">
    <text x="80" y="688" font-size="12" fill="#6B7785" font-family="Microsoft YaHei, Arial, sans-serif">第五章 · 工程底座</text>
    <text x="1200" y="688" font-size="11" fill="#6B7785" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif">25 / 30</text>
  </g>
</svg>