    <path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4" />
  </g>
    <text x="912" y="394" font-size="18" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif">四闭环工艺</text>
    <text x="912" y="420" font-size="13" fill="#DCE6FB" font-family="Microsoft YaHei, Arial, sans-serif">创意 · 需求 · 交付 · 运营持续闭环</text>
  </g>

  <g id="arm-bottom">
    <line x1="640" y1="520" x2="640" y2="600" stroke="#518FEC" stroke-width="2" />
    <polygon points="640,600 634,588 646,588" fill="#518FEC" />
    <path fill="#518FEC" d="M504,600 H776 A14,14 0 0 1 790,614 V666 A14,14 0 0 1 776,680 H504 A14,14 0 0 1 490,666 V614 A14,14 0 0 1 504,600 Z" />
    
  <g transform="translate(510.0, 624.0) scale(1.3333333333333333)" fill="none" stroke="#FFFFFF" stroke-width="2">
