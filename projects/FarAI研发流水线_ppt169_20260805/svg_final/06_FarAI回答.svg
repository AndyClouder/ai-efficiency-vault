    <text x="552" y="634" font-size="18" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif">知识本体底座</text>
    <text x="552" y="660" font-size="13" fill="#DCE6FB" font-family="Microsoft YaHei, Arial, sans-serif">让 Agent 拿到准确上下文</text>
  </g>

  <g id="arm-left">
    <line x1="520" y1="400" x2="430" y2="400" stroke="#0052A6" stroke-width="2" />
    <polygon points="430,400 442,394 442,406" fill="#0052A6" />
    <path fill="#0052A6" d="M144,360 H416 A14,14 0 0 1 430,374 V426 A14,14 0 0 1 416,440 H144 A14,14 0 0 1 130,426 V374 A14,14 0 0 1 144,360 Z" />
    
  <g transform="translate(150.0, 384.0) scale(1.3333333333333333)" fill="none" stroke="#FFFFFF" stroke-width="2">
    <path d="M3 13a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v6a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1l0 -6" />
    <path d="M15 9a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v10a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1l0 -10" />
    <path d="M9 5a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v14a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1l0 -14" />
    <path d="M4 20h14" />
  </g>
    <text x="192" y="394" font-size="18" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif">治理与度量</text>
    <text x="192" y="420" font-size="13" fill="#DCE6FB" font-family="Microsoft YaHei, Arial, sans-serif">先建安全网,再放大自主度</text>
  </g>

  <g id="footer">
    <text x="640" y="708" font-size="14" font-weight="bold" fill="#0052A6" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif">让"个人用 AI 变快",变成"组织级系统提速"</text>
  </g>
</svg>