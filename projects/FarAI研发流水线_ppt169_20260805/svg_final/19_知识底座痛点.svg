<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />
  </g>

  <g id="page-title">
    <path fill="#0052A6" d="M83,56 H133 A3,3 0 0 1 136,59 V59 A3,3 0 0 1 133,62 H83 A3,3 0 0 1 80,59 V59 A3,3 0 0 1 83,56 Z" />
    <circle cx="118" cy="92" r="14" fill="#518FEC" />
    <text x="118" y="98" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif">S3</text>
    <text x="146" y="100" font-size="28" font-weight="bold" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">Agent 拿不到准确上下文,老找错代码、误解业务</text>
  </g>

  <g id="pain-section">
    <path fill="#F4F7FC" d="M94,136 H1186 A14,14 0 0 1 1200,150 V254 A14,14 0 0 1 1186,268 H94 A14,14 0 0 1 80,254 V150 A14,14 0 0 1 94,136 Z" />
    <path fill="#F59E0B" d="M83,136 H83 A3,3 0 0 1 86,139 V265 A3,3 0 0 1 83,268 H83 A3,3 0 0 1 80,265 V139 A3,3 0 0 1 83,136 Z" />
    
  <g transform="translate(110.0, 158.0) scale(1.25)" fill="none" stroke="#F59E0B" stroke-width="2">
    <path d="M12 9v4" />
    <path d="M10.363 3.591l-8.106 13.534a1.914 1.914 0 0 0 1.636 2.871h16.214a1.914 1.914 0 0 0 1.636 -2.87l-8.106 -13.536a1.914 1.914 0 0 0 -3.274 0" />
    <path d="M12 16h.01" />
  </g>
    <text x="150" y="180" font-size="18" font-weight="bold" fill="#F59E0B" font-family="Microsoft YaHei, Arial, sans-serif">痛点:知识散落,Agent 只能"猜"</text>
    <text x="150" y="212" font-size="14" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">需求在 Confluence · 设计在 Figma · 代码在 Git · 测试在 TestRail · 契约在 Swagger · 规则在文档</text>
    <text x="150" y="238" font-size="14" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">→ Agent 检索只能靠关键词/向量相似度</text>
    <text x="150" y="260" font-size="14" font-weight="bold" fill="#F59E0B" font-family="Microsoft YaHei, Arial, sans-serif">→ 找错上下文、误解概念、遗漏约束 → 生成看似合理实则错误的方案</text>
  </g>

  <g id="layer-label">
    <text x="80" y="316" font-size="16" font-weight="bold" fill="#518FEC" font-family="Microsoft YaHei, Arial, sans-serif">三层资产结构:不是堆文件,是用本体网络把资产连起来</text>
  </g>

