    <path d="M14 20h7" />
    <path d="M10 20a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" />
    <path d="M12 15v3" />
  </g>
    <text x="144" y="466" font-size="14" fill="#DCE6FB" font-family="Microsoft YaHei, Arial, sans-serif">第二层 · 语义连接层</text>
    <text x="144" y="496" font-size="18" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif">本体网络 + 知识图谱:概念 · 系统 · 数据 · 规则 · 接口 · 测试 · 经验 全语义关联</text>
  </g>

  <g id="layer-1">
    <path fill="#0A2A5E" d="M92,532 H1188 A12,12 0 0 1 1200,544 V604 A12,12 0 0 1 1188,616 H92 A12,12 0 0 1 80,604 V544 A12,12 0 0 1 92,532 Z" />
    
  <g transform="translate(104.0, 556.0) scale(1.1666666666666667)" fill="none" stroke="#FFFFFF" stroke-width="2">
    <path d="M4 6a8 3 0 1 0 16 0a8 3 0 1 0 -16 0" />
    <path d="M4 6v6a8 3 0 0 0 16 0v-6" />
    <path d="M4 12v6a8 3 0 0 0 16 0v-6" />
  </g>
    <text x="144" y="562" font-size="14" fill="#8FA3C4" font-family="Microsoft YaHei, Arial, sans-serif">第一层 · 底层工程资产</text>
    <text x="144" y="592" font-size="18" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif">需求 · 设计 · 代码 · 测试 · 契约/API · 运行日志 · 评测集 · Agent 执行轨迹</text>
  </g>

  <g id="key-takeaway">
    <text x="640" y="652" font-size="14" font-weight="bold" fill="#0052A6" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif">Agent 不再靠关键词"猜",而是沿语义关系精确检索</text>
  </g>

  <g id="footer">
