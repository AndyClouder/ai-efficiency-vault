<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <marker id="arrowS2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#246BFE"/>
    </marker>
  </defs>

  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  </g>

  <g id="page-title">
    <rect x="80" y="56" width="56" height="6" rx="3" fill="#0052A6"/>
    <circle cx="118" cy="92" r="14" fill="#246BFE"/>
    <text x="118" y="98" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif">S2</text>
    <text x="146" y="100" font-size="28" font-weight="bold" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">AI 写的代码不敢合、不敢重构,质量靠人工把关</text>
  </g>

  <g id="pain-section">
    <rect x="80" y="136" width="1120" height="124" rx="14" fill="#F4F7FC"/>
    <rect x="80" y="136" width="6" height="124" rx="3" fill="#F59E0B"/>
    <use data-icon="tabler-outline/alert-triangle" x="110" y="158" width="30" height="30" fill="#F59E0B"/>
    <text x="150" y="180" font-size="18" font-weight="bold" fill="#F59E0B" font-family="Microsoft YaHei, Arial, sans-serif">痛点</text>
    <text x="150" y="212" font-size="15" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">工程师用 AI 写代码很快 → 但代码评审靠人肉、测试靠人工、环境数据靠手动准备</text>
    <text x="150" y="240" font-size="15" font-weight="bold" fill="#F59E0B" font-family="Microsoft YaHei, Arial, sans-serif">→ 不敢快速合并、不敢重构、不敢频繁发布</text>
  </g>

  <g id="loop-label">
    <text x="80" y="304" font-size="16" font-weight="bold" fill="#246BFE" font-family="Microsoft YaHei, Arial, sans-serif">交付闭环:质量内嵌在每一步</text>
    <text x="80" y="328" font-size="13" fill="#6B7785" font-family="Microsoft YaHei, Arial, sans-serif">质量不是最后一道关,而是交付闭环每一步的内置能力</text>
  </g>

  <g id="loop-step-1">
    <rect x="100" y="360" width="160" height="68" rx="12" fill="#0052A6"/>
    <use data-icon="tabler-outline/file-text" x="116" y="378" width="22" height="22" fill="#FFFFFF"/>
    <text x="180" y="394" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif">需求转 Spec</text>
    <text x="180" y="416" font-size="11" fill="#DCE6FB" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif">Builder + Agent</text>
  </g>
  <line x1="262" y1="394" x2="292" y2="394" stroke="#246BFE" stroke-width="2" marker-end="url(#arrowS2)"/>

  <g id="loop-step-2">
    <rect x="294" y="360" width="160" height="68" rx="12" fill="#246BFE"/>
    <use data-icon="tabler-outline/code" x="310" y="378" width="22" height="22" fill="#FFFFFF"/>
    <text x="374" y="394" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif">设计 + 编码</text>
    <text x="374" y="416" font-size="11" fill="#DCE6FB" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif">AI + Agent 协作</text>
  </g>
  <line x1="456" y1="394" x2="486" y2="394" stroke="#246BFE" stroke-width="2" marker-end="url(#arrowS2)"/>

  <g id="loop-step-3">
    <rect x="488" y="360" width="160" height="68" rx="12" fill="#246BFE"/>
    <use data-icon="tabler-outline/circle-check" x="504" y="378" width="22" height="22" fill="#FFFFFF"/>
    <text x="568" y="394" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif">fullcheck 全检</text>
    <text x="568" y="416" font-size="11" fill="#DCE6FB" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif">AI 改完即验证</text>
  </g>
  <line x1="650" y1="394" x2="680" y2="394" stroke="#246BFE" stroke-width="2" marker-end="url(#arrowS2)"/>

  <g id="loop-step-4">
    <rect x="682" y="360" width="160" height="68" rx="12" fill="#246BFE"/>
    <use data-icon="tabler-outline/terminal" x="698" y="378" width="22" height="22" fill="#FFFFFF"/>
    <text x="762" y="394" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif">CLI E2E 自动验证</text>
    <text x="762" y="416" font-size="11" fill="#DCE6FB" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif">环境/造数脚本化</text>
  </g>
  <line x1="844" y1="394" x2="874" y2="394" stroke="#246BFE" stroke-width="2" marker-end="url(#arrowS2)"/>

  <g id="loop-step-5">
    <rect x="876" y="360" width="160" height="68" rx="12" fill="#0052A6"/>
    <use data-icon="tabler-outline/eye" x="892" y="378" width="22" height="22" fill="#FFFFFF"/>
    <text x="956" y="394" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif">AI 代码评审</text>
    <text x="956" y="416" font-size="11" fill="#DCE6FB" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif">缺陷/安全/性能</text>
  </g>
  <line x1="1038" y1="394" x2="1068" y2="394" stroke="#246BFE" stroke-width="2" marker-end="url(#arrowS2)"/>

  <g id="loop-step-6">
    <rect x="1070" y="360" width="130" height="68" rx="12" fill="#0E9F6E"/>
    <use data-icon="tabler-outline/circle-check" x="1086" y="378" width="22" height="22" fill="#FFFFFF"/>
    <text x="1135" y="394" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif">可发布版本</text>
    <text x="1135" y="416" font-size="11" fill="#DCE6FB" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif">回归通过</text>
  </g>

  <g id="key-takeaway">
    <rect x="80" y="476" width="1120" height="160" rx="14" fill="#246BFE"/>
    <text x="640" y="528" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif">没有自动化安全网,AI 写得再快组织也不敢合并、重构、发布</text>
    <line x1="540" y1="556" x2="740" y2="556" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.4"/>
    <text x="640" y="592" font-size="16" fill="#DCE6FB" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif">Harness 先行 → AI 改完即可验证 → 组织才敢让 AI 高频自主</text>
  </g>

  <g id="footer">
    <text x="80" y="688" font-size="12" fill="#6B7785" font-family="Microsoft YaHei, Arial, sans-serif">第四章 · S2 智能交付闭环</text>
    <text x="1200" y="688" font-size="11" fill="#6B7785" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif">17 / 30</text>
  </g>
</svg>
