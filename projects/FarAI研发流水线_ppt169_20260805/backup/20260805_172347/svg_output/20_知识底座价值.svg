<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  </g>

  <g id="page-title">
    <rect x="80" y="56" width="56" height="6" rx="3" fill="#0052A6"/>
    <circle cx="118" cy="92" r="14" fill="#518FEC"/>
    <text x="118" y="98" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif">S3</text>
    <text x="146" y="100" font-size="28" font-weight="bold" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">本体网络让 Agent 沿业务语义和工程依赖,找到准确上下文</text>
    <text x="80" y="128" font-size="15" fill="#6B7785" font-family="Microsoft YaHei, Arial, sans-serif">Agent 不再"猜",而是沿语义关系精确检索</text>
  </g>

  <g id="capability-block">
    <rect x="80" y="160" width="640" height="460" rx="16" fill="#F4F7FC"/>
    <use data-icon="tabler-outline/network" x="108" y="184" width="32" height="32" fill="#518FEC"/>
    <text x="150" y="208" font-size="20" font-weight="bold" fill="#518FEC" font-family="Microsoft YaHei, Arial, sans-serif">FarAI 能力</text>
    <line x1="108" y1="232" x2="692" y2="232" stroke="#E3E9F2" stroke-width="1"/>

    <g id="cap-1">
      <circle cx="124" cy="280" r="14" fill="#518FEC"/>
      <text x="124" y="286" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif">1</text>
      <use data-icon="tabler-outline/network" x="148" y="264" width="26" height="26" fill="#0052A6"/>
      <text x="182" y="284" font-size="16" font-weight="bold" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">本体网络</text>
      <text x="182" y="308" font-size="13" fill="#5E6A78" font-family="Microsoft YaHei, Arial, sans-serif">业务概念/系统边界/数据实体/接口契约/规则语义关联</text>
    </g>

    <g id="cap-2">
      <circle cx="124" cy="360" r="14" fill="#518FEC"/>
      <text x="124" y="366" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif">2</text>
      <use data-icon="tabler-outline/search" x="148" y="344" width="26" height="26" fill="#0052A6"/>
      <text x="182" y="364" font-size="16" font-weight="bold" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">知识联通底座</text>
      <text x="182" y="388" font-size="13" fill="#5E6A78" font-family="Microsoft YaHei, Arial, sans-serif">本体网络 + 语义检索 + 向量检索 + 代码引用关系</text>
    </g>

    <g id="cap-3">
      <circle cx="124" cy="440" r="14" fill="#518FEC"/>
      <text x="124" y="446" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif">3</text>
      <use data-icon="tabler-outline/brain" x="148" y="424" width="26" height="26" fill="#0052A6"/>
      <text x="182" y="444" font-size="16" font-weight="bold" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">Agent 记忆</text>
      <text x="182" y="468" font-size="13" fill="#5E6A78" font-family="Microsoft YaHei, Arial, sans-serif">任务/工具/文档/失败/纠偏过程数据结构化保存</text>
    </g>

    <g id="cap-4">
      <circle cx="124" cy="520" r="14" fill="#518FEC"/>
      <text x="124" y="526" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif">4</text>
      <use data-icon="tabler-outline/refresh" x="148" y="504" width="26" height="26" fill="#0052A6"/>
      <text x="182" y="524" font-size="16" font-weight="bold" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">经验进化底座</text>
      <text x="182" y="548" font-size="13" fill="#5E6A78" font-family="Microsoft YaHei, Arial, sans-serif">Prompt/Skill/规则/最佳实践 版本化、评测、持续改进</text>
    </g>
  </g>

  <g id="value-block">
    <rect x="740" y="160" width="460" height="460" rx="16" fill="#518FEC"/>
    <use data-icon="tabler-outline/trending-up" x="768" y="184" width="32" height="32" fill="#FFFFFF"/>
    <text x="810" y="208" font-size="20" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif">价值</text>
    <line x1="768" y1="232" x2="1172" y2="232" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.3"/>

    <g id="val-1">
      <text x="768" y="300" font-size="32" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif">分钟级 → 秒级</text>
      <text x="768" y="332" font-size="16" fill="#DCE6FB" font-family="Microsoft YaHei, Arial, sans-serif">上下文获取时效</text>
      <text x="768" y="354" font-size="12" fill="#B8C7E0" font-family="Microsoft YaHei, Arial, sans-serif">(预估)</text>
    </g>

    <line x1="768" y1="380" x2="1172" y2="380" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.2"/>

    <g id="val-2">
      <text x="768" y="440" font-size="40" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif">↑50%+</text>
      <text x="768" y="472" font-size="16" fill="#DCE6FB" font-family="Microsoft YaHei, Arial, sans-serif">知识/资产复用率</text>
      <text x="768" y="494" font-size="12" fill="#B8C7E0" font-family="Microsoft YaHei, Arial, sans-serif">(预估)</text>
    </g>

    <line x1="768" y1="520" x2="1172" y2="520" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.2"/>

    <g id="val-3">
      <text x="768" y="572" font-size="18" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif">Agent 越用越准</text>
      <text x="768" y="596" font-size="14" fill="#DCE6FB" font-family="Microsoft YaHei, Arial, sans-serif">组织经验持续进化成能力(预估)</text>
    </g>
  </g>

  <g id="footer">
    <text x="80" y="688" font-size="12" fill="#6B7785" font-family="Microsoft YaHei, Arial, sans-serif">第四章 · S3 智能知识底座</text>
    <text x="1200" y="688" font-size="11" fill="#6B7785" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif">20 / 30</text>
  </g>
</svg>
