    <rect x="576" y="510" width="150" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.08"/>
    <text x="651" y="536" font-size="14" fill="#DCE6FB" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif">S4 治理 FinOps</text>
