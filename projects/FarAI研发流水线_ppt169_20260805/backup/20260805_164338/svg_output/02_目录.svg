<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  </g>

  <g id="page-header">
    <rect x="80" y="64" width="56" height="6" rx="3" fill="#0052A6"/>
    <text x="80" y="108" font-size="30" font-weight="bold" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">五章构成"从悖论到落地"的完整叙事</text>
    <text x="80" y="140" font-size="16" fill="#6B7785" font-family="Microsoft YaHei, Arial, sans-serif">命题 → 全景 → 场景 → 工程底座 → 价值实施</text>
  </g>

  <g id="toc-card-1">
    <rect x="80" y="180" width="216" height="460" rx="14" fill="#F4F7FC"/>
    <rect x="80" y="180" width="216" height="56" rx="14" fill="#0052A6"/>
    <rect x="80" y="208" width="216" height="28" fill="#0052A6"/>
    <text x="104" y="216" font-size="36" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif">01</text>
    <text x="104" y="280" font-size="20" font-weight="bold" fill="#0052A6" font-family="Microsoft YaHei, Arial, sans-serif">核心命题</text>
    <text x="104" y="312" font-size="14" fill="#5E6A78" font-family="Microsoft YaHei, Arial, sans-serif">个人提效 ≠ 组织提效</text>
    <line x1="104" y1="334" x2="272" y2="334" stroke="#E3E9F2" stroke-width="1"/>
    <text x="104" y="370" font-size="13" fill="#5E6A78" font-family="Microsoft YaHei, Arial, sans-serif">· 核心悖论</text>
    <text x="104" y="394" font-size="13" fill="#5E6A78" font-family="Microsoft YaHei, Arial, sans-serif">· 根因剖析</text>
    <text x="104" y="418" font-size="13" fill="#5E6A78" font-family="Microsoft YaHei, Arial, sans-serif">· FarAI 的回答</text>
    <text x="104" y="612" font-size="12" fill="#6B7785" font-family="Microsoft YaHei, Arial, sans-serif">P03 — P06</text>
  </g>

  <g id="toc-card-2">
    <rect x="312" y="180" width="216" height="460" rx="14" fill="#F4F7FC"/>
    <rect x="312" y="180" width="216" height="56" rx="14" fill="#246BFE"/>
    <rect x="312" y="208" width="216" height="28" fill="#246BFE"/>
    <text x="336" y="216" font-size="36" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif">02</text>
    <text x="336" y="280" font-size="20" font-weight="bold" fill="#246BFE" font-family="Microsoft YaHei, Arial, sans-serif">产品全景</text>
    <text x="336" y="312" font-size="14" fill="#5E6A78" font-family="Microsoft YaHei, Arial, sans-serif">FarAI 研发流水线</text>
    <line x1="336" y1="334" x2="504" y2="334" stroke="#E3E9F2" stroke-width="1"/>
    <text x="336" y="370" font-size="13" fill="#5E6A78" font-family="Microsoft YaHei, Arial, sans-serif">· 四层架构</text>
    <text x="336" y="394" font-size="13" fill="#5E6A78" font-family="Microsoft YaHei, Arial, sans-serif">· 四大场景映射</text>
    <text x="336" y="612" font-size="12" fill="#6B7785" font-family="Microsoft YaHei, Arial, sans-serif">P07 — P09</text>
  </g>

  <g id="toc-card-3">
    <rect x="544" y="180" width="216" height="460" rx="14" fill="#F4F7FC"/>
    <rect x="544" y="180" width="216" height="56" rx="14" fill="#518FEC"/>
    <rect x="544" y="208" width="216" height="28" fill="#518FEC"/>
    <text x="568" y="216" font-size="36" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif">03</text>
    <text x="568" y="280" font-size="20" font-weight="bold" fill="#518FEC" font-family="Microsoft YaHei, Arial, sans-serif">四大场景</text>
    <text x="568" y="312" font-size="14" fill="#5E6A78" font-family="Microsoft YaHei, Arial, sans-serif">每个场景一个闭环</text>
    <line x1="568" y1="334" x2="736" y2="334" stroke="#E3E9F2" stroke-width="1"/>
    <text x="568" y="370" font-size="13" fill="#5E6A78" font-family="Microsoft YaHei, Arial, sans-serif">· 需求闭环</text>
    <text x="568" y="394" font-size="13" fill="#5E6A78" font-family="Microsoft YaHei, Arial, sans-serif">· 交付闭环</text>
    <text x="568" y="418" font-size="13" fill="#5E6A78" font-family="Microsoft YaHei, Arial, sans-serif">· 知识底座</text>
    <text x="568" y="442" font-size="13" fill="#5E6A78" font-family="Microsoft YaHei, Arial, sans-serif">· 治理 FinOps</text>
    <text x="568" y="612" font-size="12" fill="#6B7785" font-family="Microsoft YaHei, Arial, sans-serif">P10 — P18</text>
  </g>

  <g id="toc-card-4">
    <rect x="776" y="180" width="216" height="460" rx="14" fill="#F4F7FC"/>
    <rect x="776" y="180" width="216" height="56" rx="14" fill="#0052A6"/>
    <rect x="776" y="208" width="216" height="28" fill="#0052A6"/>
    <text x="800" y="216" font-size="36" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif">04</text>
    <text x="800" y="280" font-size="20" font-weight="bold" fill="#0052A6" font-family="Microsoft YaHei, Arial, sans-serif">工程底座</text>
    <text x="800" y="312" font-size="14" fill="#5E6A78" font-family="Microsoft YaHei, Arial, sans-serif">Harness 驾驭框架</text>
    <line x1="800" y1="334" x2="968" y2="334" stroke="#E3E9F2" stroke-width="1"/>
    <text x="800" y="370" font-size="13" fill="#5E6A78" font-family="Microsoft YaHei, Arial, sans-serif">· 9 大组件</text>
    <text x="800" y="394" font-size="13" fill="#5E6A78" font-family="Microsoft YaHei, Arial, sans-serif">· 先行原则</text>
    <text x="800" y="418" font-size="13" fill="#5E6A78" font-family="Microsoft YaHei, Arial, sans-serif">· 实战度量</text>
    <text x="800" y="612" font-size="12" fill="#6B7785" font-family="Microsoft YaHei, Arial, sans-serif">P19 — P22</text>
  </g>

  <g id="toc-card-5">
    <rect x="1008" y="180" width="192" height="460" rx="14" fill="#F4F7FC"/>
    <rect x="1008" y="180" width="192" height="56" rx="14" fill="#246BFE"/>
    <rect x="1008" y="208" width="192" height="28" fill="#246BFE"/>
    <text x="1032" y="216" font-size="36" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif">05</text>
    <text x="1032" y="280" font-size="20" font-weight="bold" fill="#246BFE" font-family="Microsoft YaHei, Arial, sans-serif">价值实施</text>
    <text x="1032" y="312" font-size="14" fill="#5E6A78" font-family="Microsoft YaHei, Arial, sans-serif">从试点到规模化</text>
    <line x1="1032" y1="334" x2="1176" y2="334" stroke="#E3E9F2" stroke-width="1"/>
    <text x="1032" y="370" font-size="13" fill="#5E6A78" font-family="Microsoft YaHei, Arial, sans-serif">· 商业价值矩阵</text>
    <text x="1032" y="394" font-size="13" fill="#5E6A78" font-family="Microsoft YaHei, Arial, sans-serif">· 实施路径</text>
    <text x="1032" y="418" font-size="13" fill="#5E6A78" font-family="Microsoft YaHei, Arial, sans-serif">· 法本保障</text>
    <text x="1032" y="612" font-size="12" fill="#6B7785" font-family="Microsoft YaHei, Arial, sans-serif">P23 — P27</text>
  </g>

  <g id="footer">
    <text x="1200" y="688" font-size="11" fill="#6B7785" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif">02 / 27</text>
  </g>
</svg>
