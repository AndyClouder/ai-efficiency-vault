<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  </g>

  <g id="page-title">
    <rect x="80" y="68" width="56" height="6" rx="3" fill="#0052A6"/>
    <text x="80" y="112" font-size="30" font-weight="bold" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">个人都在用 AI,版本还是按原节奏发</text>
  </g>

  <g id="left-block">
    <rect x="80" y="160" width="540" height="340" rx="16" fill="#F4F7FC"/>
    <rect x="80" y="160" width="6" height="340" rx="3" fill="#0E9F6E"/>
    <use data-icon="tabler-outline/user" x="112" y="184" width="36" height="36" fill="#0E9F6E"/>
    <text x="160" y="212" font-size="20" font-weight="bold" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">个人层面:已经变快了</text>
    <line x1="112" y1="240" x2="600" y2="240" stroke="#E3E9F2" stroke-width="1"/>
    <text x="112" y="284" font-size="16" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">产品经理用 AI 生成原型</text>
    <text x="112" y="324" font-size="16" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">工程师用 AI 读码、写码、补测试</text>
    <text x="112" y="364" font-size="16" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">测试用 AI 整理用例、分析缺陷</text>
    <text x="112" y="404" font-size="16" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">架构师用 AI 做影响分析</text>
    <text x="112" y="464" font-size="18" font-weight="bold" fill="#0E9F6E" font-family="Microsoft YaHei, Arial, sans-serif">每个人似乎都变快了一些</text>
  </g>

  <g id="right-block">
    <rect x="660" y="160" width="540" height="340" rx="16" fill="#F4F7FC"/>
    <rect x="660" y="160" width="6" height="340" rx="3" fill="#F59E0B"/>
    <use data-icon="tabler-outline/alert-triangle" x="692" y="184" width="36" height="36" fill="#F59E0B"/>
    <text x="740" y="212" font-size="20" font-weight="bold" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">组织层面:感受不到提速</text>
    <line x1="692" y1="240" x2="1180" y2="240" stroke="#E3E9F2" stroke-width="1"/>
    <text x="692" y="284" font-size="16" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">需求仍然在排队</text>
    <text x="692" y="324" font-size="16" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">版本仍按原节奏推进</text>
    <text x="692" y="364" font-size="16" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">跨团队沟通、联调评审仍反复</text>
    <text x="692" y="404" font-size="16" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">测试环境仍然紧张</text>
    <text x="692" y="464" font-size="18" font-weight="bold" fill="#F59E0B" font-family="Microsoft YaHei, Arial, sans-serif">组织整体并没有同步变快</text>
  </g>

  <g id="conclusion">
    <rect x="80" y="548" width="1120" height="100" rx="16" fill="#0052A6"/>
    <text x="640" y="590" font-size="32" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif">个人提效 ≠ 组织提效</text>
    <text x="640" y="624" font-size="16" fill="#DCE6FB" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif">个人提效已经发生,组织提效没有自然发生</text>
  </g>

  <g id="footer">
    <text x="80" y="688" font-size="12" fill="#6B7785" font-family="Microsoft YaHei, Arial, sans-serif">第一章 · 核心命题</text>
    <text x="1200" y="688" font-size="11" fill="#6B7785" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif">04 / 27</text>
  </g>
</svg>
