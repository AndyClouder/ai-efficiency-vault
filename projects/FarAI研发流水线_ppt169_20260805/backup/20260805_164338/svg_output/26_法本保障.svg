<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  </g>

  <g id="page-title">
    <rect x="80" y="56" width="56" height="6" rx="3" fill="#0052A6"/>
    <text x="80" y="100" font-size="28" font-weight="bold" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">为什么是法本 —— 四重保障托底 FarAI 研发流水线落地</text>
    <text x="80" y="128" font-size="15" fill="#6B7785" font-family="Microsoft YaHei, Arial, sans-serif">能力底座 + 交付经验 + 安全合规 + 生态合作,托底端到端落地</text>
  </g>

  <g id="card-capability">
    <rect x="80" y="172" width="270" height="448" rx="16" fill="#F4F7FC"/>
    <rect x="80" y="172" width="270" height="100" rx="16" fill="#0052A6"/>
    <rect x="80" y="230" width="270" height="42" fill="#0052A6"/>
    <use data-icon="tabler-outline/layout-2" x="104" y="196" width="40" height="40" fill="#FFFFFF"/>
    <text x="156" y="226" font-size="20" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif">能力底座</text>
    <text x="104" y="320" font-size="14" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">FarAI 全栈产品矩阵</text>
    <text x="104" y="356" font-size="14" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">自研 Agent / Skill 框架</text>
    <text x="104" y="392" font-size="14" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">本体网络与知识工程</text>
    <text x="104" y="428" font-size="14" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">Harness 工程方法论</text>
    <line x1="104" y1="478" x2="326" y2="478" stroke="#E3E9F2" stroke-width="1"/>
    <text x="104" y="520" font-size="12" fill="#6B7785" font-family="Microsoft YaHei, Arial, sans-serif">从模型、Agent、Skill、</text>
    <text x="104" y="542" font-size="12" fill="#6B7785" font-family="Microsoft YaHei, Arial, sans-serif">知识到底座的全栈能力</text>
    <text x="104" y="584" font-size="12" font-weight="bold" fill="#0052A6" font-family="Microsoft YaHei, Arial, sans-serif">技术产品全栈自研</text>
  </g>

  <g id="card-delivery">
    <rect x="370" y="172" width="270" height="448" rx="16" fill="#F4F7FC"/>
    <rect x="370" y="172" width="270" height="100" rx="16" fill="#246BFE"/>
    <rect x="370" y="230" width="270" height="42" fill="#246BFE"/>
    <use data-icon="tabler-outline/route" x="394" y="196" width="40" height="40" fill="#FFFFFF"/>
    <text x="446" y="226" font-size="20" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif">交付经验</text>
    <text x="394" y="320" font-size="14" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">多行业研发组织落地</text>
    <text x="394" y="356" font-size="14" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">标准化实施方法论</text>
    <text x="394" y="392" font-size="14" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">试点-复制路径成熟</text>
    <text x="394" y="428" font-size="14" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">多产品线规模化实践</text>
    <line x1="394" y1="478" x2="616" y2="478" stroke="#E3E9F2" stroke-width="1"/>
    <text x="394" y="520" font-size="12" fill="#6B7785" font-family="Microsoft YaHei, Arial, sans-serif">金融/制造/科技等行业</text>
    <text x="394" y="542" font-size="12" fill="#6B7785" font-family="Microsoft YaHei, Arial, sans-serif">研发效能落地经验</text>
    <text x="394" y="584" font-size="12" font-weight="bold" fill="#246BFE" font-family="Microsoft YaHei, Arial, sans-serif">方法论 + 标杆案例</text>
  </g>

  <g id="card-security">
    <rect x="660" y="172" width="270" height="448" rx="16" fill="#F4F7FC"/>
    <rect x="660" y="172" width="270" height="100" rx="16" fill="#518FEC"/>
    <rect x="660" y="230" width="270" height="42" fill="#518FEC"/>
    <use data-icon="tabler-outline/shield" x="684" y="196" width="40" height="40" fill="#FFFFFF"/>
    <text x="736" y="226" font-size="20" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif">安全合规</text>
    <text x="684" y="320" font-size="14" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">企业级数据安全</text>
    <text x="684" y="356" font-size="14" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">权限与审计</text>
    <text x="684" y="392" font-size="14" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">风险分级行权</text>
    <text x="684" y="428" font-size="14" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">私有化部署支持</text>
    <line x1="684" y1="478" x2="906" y2="478" stroke="#E3E9F2" stroke-width="1"/>
    <text x="684" y="520" font-size="12" fill="#6B7785" font-family="Microsoft YaHei, Arial, sans-serif">数据不出域、权限</text>
    <text x="684" y="542" font-size="12" fill="#6B7785" font-family="Microsoft YaHei, Arial, sans-serif">可控、操作可审计</text>
    <text x="684" y="584" font-size="12" font-weight="bold" fill="#518FEC" font-family="Microsoft YaHei, Arial, sans-serif">企业级 · 国产化</text>
  </g>

  <g id="card-ecosystem">
    <rect x="950" y="172" width="250" height="448" rx="16" fill="#F4F7FC"/>
    <rect x="950" y="172" width="250" height="100" rx="16" fill="#0E9F6E"/>
    <rect x="950" y="230" width="250" height="42" fill="#0E9F6E"/>
    <use data-icon="tabler-outline/network" x="974" y="196" width="40" height="40" fill="#FFFFFF"/>
    <text x="1026" y="226" font-size="20" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif">生态合作</text>
    <text x="974" y="320" font-size="14" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">主流大模型集成</text>
    <text x="974" y="356" font-size="14" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">编码工具打通</text>
    <text x="974" y="392" font-size="14" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">DevOps 工具链接入</text>
    <text x="974" y="428" font-size="14" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">行业标杆客户协同</text>
    <line x1="974" y1="478" x2="1176" y2="478" stroke="#E3E9F2" stroke-width="1"/>
    <text x="974" y="520" font-size="12" fill="#6B7785" font-family="Microsoft YaHei, Arial, sans-serif">开放生态、持续</text>
    <text x="974" y="542" font-size="12" fill="#6B7785" font-family="Microsoft YaHei, Arial, sans-serif">演进的技术合作</text>
    <text x="974" y="584" font-size="12" font-weight="bold" fill="#0E9F6E" font-family="Microsoft YaHei, Arial, sans-serif">开放 · 共建</text>
  </g>

  <g id="footer">
    <text x="80" y="688" font-size="12" fill="#6B7785" font-family="Microsoft YaHei, Arial, sans-serif">第五章 · 价值实施</text>
    <text x="1200" y="688" font-size="11" fill="#6B7785" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif">26 / 27</text>
  </g>
</svg>
