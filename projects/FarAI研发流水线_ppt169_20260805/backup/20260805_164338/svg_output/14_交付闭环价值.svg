<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  </g>

  <g id="page-title">
    <rect x="80" y="56" width="56" height="6" rx="3" fill="#0052A6"/>
    <circle cx="118" cy="92" r="14" fill="#246BFE"/>
    <text x="118" y="98" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif">S2</text>
    <text x="146" y="100" font-size="28" font-weight="bold" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">Harness + 自动化测试,让 AI 改完即可验证可发布</text>
    <text x="80" y="128" font-size="15" fill="#6B7785" font-family="Microsoft YaHei, Arial, sans-serif">自动化测试安全网越强,AI 能承担的自主执行范围越大</text>
  </g>

  <g id="capability-block">
    <rect x="80" y="160" width="640" height="460" rx="16" fill="#F4F7FC"/>
    <use data-icon="tabler-outline/settings" x="108" y="184" width="32" height="32" fill="#246BFE"/>
    <text x="150" y="208" font-size="20" font-weight="bold" fill="#246BFE" font-family="Microsoft YaHei, Arial, sans-serif">FarAI 能力(Harness 组件)</text>
    <line x1="108" y1="232" x2="692" y2="232" stroke="#E3E9F2" stroke-width="1"/>

    <g id="cap-1">
      <circle cx="124" cy="270" r="13" fill="#246BFE"/>
      <text x="124" y="276" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif">1</text>
      <text x="148" y="266" font-size="15" font-weight="bold" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">fullcheck 全量检查</text>
      <text x="148" y="286" font-size="13" fill="#5E6A78" font-family="Microsoft YaHei, Arial, sans-serif">单测/接口/契约/E2E/回归,AI 改完即验证</text>
    </g>

    <g id="cap-2">
      <circle cx="124" cy="328" r="13" fill="#246BFE"/>
      <text x="124" y="334" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif">2</text>
      <text x="148" y="324" font-size="15" font-weight="bold" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">CLI E2E 自动化</text>
      <text x="148" y="344" font-size="13" fill="#5E6A78" font-family="Microsoft YaHei, Arial, sans-serif">环境/数据/造数脚本化,Agent 可自主验证</text>
    </g>

    <g id="cap-3">
      <circle cx="124" cy="386" r="13" fill="#246BFE"/>
      <text x="124" y="392" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif">3</text>
      <text x="148" y="382" font-size="15" font-weight="bold" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">AI 代码评审</text>
      <text x="148" y="402" font-size="13" fill="#5E6A78" font-family="Microsoft YaHei, Arial, sans-serif">提前发现缺陷、安全、性能、测试缺口</text>
    </g>

    <g id="cap-4">
      <circle cx="124" cy="444" r="13" fill="#246BFE"/>
      <text x="124" y="450" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif">4</text>
      <text x="148" y="440" font-size="15" font-weight="bold" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">架构规则 as Code</text>
      <text x="148" y="460" font-size="13" fill="#5E6A78" font-family="Microsoft YaHei, Arial, sans-serif">分层依赖/契约兼容/越权访问持续守护</text>
    </g>

    <g id="cap-5">
      <circle cx="124" cy="502" r="13" fill="#246BFE"/>
      <text x="124" y="508" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif">5</text>
      <text x="148" y="498" font-size="15" font-weight="bold" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">traceId 全链路追踪</text>
      <text x="148" y="518" font-size="13" fill="#5E6A78" font-family="Microsoft YaHei, Arial, sans-serif">Agent 每一步可追溯、可复盘</text>
    </g>
  </g>

  <g id="value-block">
    <rect x="740" y="160" width="460" height="460" rx="16" fill="#246BFE"/>
    <use data-icon="tabler-outline/trending-up" x="768" y="184" width="32" height="32" fill="#FFFFFF"/>
    <text x="810" y="208" font-size="20" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif">价值</text>
    <line x1="768" y1="232" x2="1172" y2="232" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.3"/>

    <g id="val-1">
      <text x="768" y="300" font-size="40" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif">↓40-60%</text>
      <text x="768" y="332" font-size="16" fill="#DCE6FB" font-family="Microsoft YaHei, Arial, sans-serif">返工/缺陷率</text>
      <text x="768" y="354" font-size="12" fill="#B8C7E0" font-family="Microsoft YaHei, Arial, sans-serif">(预估)</text>
    </g>

    <line x1="768" y1="380" x2="1172" y2="380" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.15"/>

    <g id="val-2">
      <text x="768" y="440" font-size="40" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif">↑3-5 倍</text>
      <text x="768" y="472" font-size="16" fill="#DCE6FB" font-family="Microsoft YaHei, Arial, sans-serif">安全合并/重构吞吐</text>
      <text x="768" y="494" font-size="12" fill="#B8C7E0" font-family="Microsoft YaHei, Arial, sans-serif">(预估)</text>
    </g>

    <line x1="768" y1="520" x2="1172" y2="520" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.15"/>

    <g id="val-3">
      <text x="768" y="572" font-size="18" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif">AI 自主执行范围</text>
      <text x="768" y="596" font-size="14" fill="#DCE6FB" font-family="Microsoft YaHei, Arial, sans-serif">随安全网强度放大(预估)</text>
    </g>
  </g>

  <g id="footer">
    <text x="80" y="688" font-size="12" fill="#6B7785" font-family="Microsoft YaHei, Arial, sans-serif">第三章 · S2 智能交付闭环</text>
    <text x="1200" y="688" font-size="11" fill="#6B7785" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif">14 / 27</text>
  </g>
</svg>
