<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  </g>

  <g id="page-title">
    <rect x="80" y="56" width="56" height="6" rx="3" fill="#0052A6"/>
    <text x="80" y="100" font-size="28" font-weight="bold" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">四维价值 —— 效率 · 质量 · 成本 · 进化</text>
    <text x="80" y="128" font-size="15" fill="#6B7785" font-family="Microsoft YaHei, Arial, sans-serif">FarAI 研发流水线从四个维度,把个人提效升级为组织系统提效</text>
  </g>

  <g id="quadrant-efficiency">
    <rect x="80" y="160" width="555" height="232" rx="16" fill="#F4F7FC"/>
    <rect x="80" y="160" width="6" height="232" rx="3" fill="#0052A6"/>
    <use data-icon="tabler-outline/bolt" x="108" y="184" width="32" height="32" fill="#0052A6"/>
    <text x="150" y="208" font-size="22" font-weight="bold" fill="#0052A6" font-family="Microsoft YaHei, Arial, sans-serif">效率</text>
    <text x="615" y="208" font-size="14" fill="#6B7785" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif">速度类指标</text>
    <line x1="108" y1="232" x2="615" y2="232" stroke="#E3E9F2" stroke-width="1"/>
    <text x="108" y="288" font-size="34" font-weight="bold" fill="#0052A6" font-family="Microsoft YaHei, Arial, sans-serif">↓40-50%</text>
    <text x="108" y="318" font-size="15" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">需求返工率(预估)</text>
    <text x="345" y="288" font-size="34" font-weight="bold" fill="#0052A6" font-family="Microsoft YaHei, Arial, sans-serif">↑3-5 倍</text>
    <text x="345" y="318" font-size="15" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">安全合并吞吐(预估)</text>
    <text x="108" y="368" font-size="13" fill="#6B7785" font-family="Microsoft YaHei, Arial, sans-serif">个人变快 → 小队/产品线/组织级系统提速</text>
  </g>

  <g id="quadrant-quality">
    <rect x="655" y="160" width="545" height="232" rx="16" fill="#F4F7FC"/>
    <rect x="655" y="160" width="6" height="232" rx="3" fill="#246BFE"/>
    <use data-icon="tabler-outline/shield" x="683" y="184" width="32" height="32" fill="#246BFE"/>
    <text x="725" y="208" font-size="22" font-weight="bold" fill="#246BFE" font-family="Microsoft YaHei, Arial, sans-serif">质量</text>
    <text x="1180" y="208" font-size="14" fill="#6B7785" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif">风险类指标</text>
    <line x1="683" y1="232" x2="1180" y2="232" stroke="#E3E9F2" stroke-width="1"/>
    <text x="683" y="288" font-size="34" font-weight="bold" fill="#246BFE" font-family="Microsoft YaHei, Arial, sans-serif">↓40-60%</text>
    <text x="683" y="318" font-size="15" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">缺陷/返工率(预估)</text>
    <text x="920" y="288" font-size="34" font-weight="bold" fill="#246BFE" font-family="Microsoft YaHei, Arial, sans-serif">↓30-50%</text>
    <text x="920" y="318" font-size="15" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">高风险漏审(预估)</text>
    <text x="683" y="368" font-size="13" fill="#6B7785" font-family="Microsoft YaHei, Arial, sans-serif">Harness 安全网让 AI 改完即可验证</text>
  </g>

  <g id="quadrant-cost">
    <rect x="80" y="404" width="555" height="232" rx="16" fill="#F4F7FC"/>
    <rect x="80" y="404" width="6" height="232" rx="3" fill="#518FEC"/>
    <use data-icon="tabler-outline/cash" x="108" y="428" width="32" height="32" fill="#518FEC"/>
    <text x="150" y="452" font-size="22" font-weight="bold" fill="#518FEC" font-family="Microsoft YaHei, Arial, sans-serif">成本</text>
    <text x="615" y="452" font-size="14" fill="#6B7785" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif">资源类指标</text>
    <line x1="108" y1="476" x2="615" y2="476" stroke="#E3E9F2" stroke-width="1"/>
    <text x="108" y="532" font-size="28" font-weight="bold" fill="#518FEC" font-family="Microsoft YaHei, Arial, sans-serif">分钟级 → 秒级</text>
    <text x="108" y="562" font-size="15" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">上下文获取时效(预估)</text>
    <text x="345" y="532" font-size="28" font-weight="bold" fill="#518FEC" font-family="Microsoft YaHei, Arial, sans-serif">Token ROI</text>
    <text x="345" y="562" font-size="15" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">持续可视化(预估)</text>
    <text x="108" y="612" font-size="13" fill="#6B7785" font-family="Microsoft YaHei, Arial, sans-serif">AI FinOps 让"用了多少"升级为"带来什么收益"</text>
  </g>

  <g id="quadrant-evolution">
    <rect x="655" y="404" width="545" height="232" rx="16" fill="#F4F7FC"/>
    <rect x="655" y="404" width="6" height="232" rx="3" fill="#0E9F6E"/>
    <use data-icon="tabler-outline/refresh" x="683" y="428" width="32" height="32" fill="#0E9F6E"/>
    <text x="725" y="452" font-size="22" font-weight="bold" fill="#0E9F6E" font-family="Microsoft YaHei, Arial, sans-serif">进化</text>
    <text x="1180" y="452" font-size="14" fill="#6B7785" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif">长期复利</text>
    <line x1="683" y1="476" x2="1180" y2="476" stroke="#E3E9F2" stroke-width="1"/>
    <text x="683" y="532" font-size="34" font-weight="bold" fill="#0E9F6E" font-family="Microsoft YaHei, Arial, sans-serif">↑50%+</text>
    <text x="683" y="562" font-size="15" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">知识/资产复用率(预估)</text>
    <text x="920" y="532" font-size="20" font-weight="bold" fill="#0E9F6E" font-family="Microsoft YaHei, Arial, sans-serif">越用越准</text>
    <text x="920" y="562" font-size="15" fill="#25364A" font-family="Microsoft YaHei, Arial, sans-serif">组织经验成能力(预估)</text>
    <text x="683" y="612" font-size="13" fill="#6B7785" font-family="Microsoft YaHei, Arial, sans-serif">本体网络 + Agent 记忆 + 经验进化底座持续复利</text>
  </g>

  <g id="footer">
    <text x="80" y="688" font-size="11" fill="#6B7785" font-family="Microsoft YaHei, Arial, sans-serif">* 以上为预估值,可按实际业务量与代码库规模校准 · 第六章 · 价值实施</text>
    <text x="1200" y="688" font-size="11" fill="#6B7785" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif">28 / 30</text>
  </g>
</svg>
