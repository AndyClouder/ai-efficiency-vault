<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="endingBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A2A5E"/>
      <stop offset="55%" stop-color="#0E367A"/>
      <stop offset="100%" stop-color="#17365D"/>
    </linearGradient>
  </defs>

  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="url(#endingBg)"/>
    <circle cx="640" cy="360" r="280" fill="#246BFE" fill-opacity="0.06"/>
    <circle cx="640" cy="360" r="180" fill="#518FEC" fill-opacity="0.04"/>
  </g>

  <g id="logo-area">
    <use data-icon="tabler-outline/robot" x="600" y="160" width="56" height="56" fill="#246BFE"/>
    <text x="664" y="196" font-size="24" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif">FarAI</text>
  </g>

  <g id="main-slogan">
    <text x="640" y="350" font-size="44" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif">让 AI 在你的研发组织里,</text>
    <text x="640" y="410" font-size="44" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif">可控地跑起来</text>
  </g>

  <g id="accent-line">
    <rect x="600" y="444" width="80" height="4" rx="2" fill="#246BFE"/>
  </g>

  <g id="sub-slogan">
    <text x="640" y="500" font-size="20" fill="#B8C7E0" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif">FarAI 研发流水线 · 个人提效 → 组织提效</text>
  </g>

  <g id="contact-area">
    <line x1="440" y1="568" x2="840" y2="568" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.15"/>
    <use data-icon="tabler-outline/message" x="510" y="592" width="24" height="24" fill="#518FEC"/>
    <text x="542" y="612" font-size="14" fill="#B8C7E0" font-family="Microsoft YaHei, Arial, sans-serif">扫码咨询</text>
    <use data-icon="tabler-outline/building" x="640" y="592" width="24" height="24" fill="#518FEC"/>
    <text x="672" y="612" font-size="14" fill="#B8C7E0" font-family="Microsoft YaHei, Arial, sans-serif">法本信息 Farben</text>
    <use data-icon="tabler-outline/headset" x="770" y="592" width="24" height="24" fill="#518FEC"/>
    <text x="802" y="612" font-size="14" fill="#B8C7E0" font-family="Microsoft YaHei, Arial, sans-serif">售前对接</text>
  </g>

  <g id="footer">
    <text x="640" y="680" font-size="12" fill="#8FA3C4" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif">法本信息 · FarAI 研发流水线售前方案 · 2026</text>
  </g>
</svg>
